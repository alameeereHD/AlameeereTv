<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>تجربة البث المباشر</title>
  <!-- استدعاء مكتبة HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body style="background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

  <div style="width: 100%; max-width: 800px; text-align: center;">
    <video id="videoPlayer" controls autoplay style="width: 100%; border-radius: 8px; background: #000;"></video>
  </div>

  <script>
    const video = document.getElementById('videoPlayer');
    
    // الرابط المباشر للبث
    const originalStream = "https://ahm79.store/live/0545580310/7337741654/746717.m3u8";
    const userAgent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)";
    
    // تغليف الرابط بالبروكسي الخاص بك مع تشفير الرموز
    const proxiedStreamUrl = `https://my-proxy.alameeeretv.workers.dev/?url=${encodeURIComponent(originalStream)}&ua=${encodeURIComponent(userAgent)}`;

    if (Hls.isSupported()) {
      const hls = new Hls({
        debug: false,
        enableWorker: true
      });
      hls.loadSource(proxiedStreamUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        video.play();
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // دعم متصفح Safari على iOS و Mac
      video.src = proxiedStreamUrl;
      video.addEventListener('loadedmetadata', function() {
        video.play();
      });
    }
  </script>

</body>
</html>
