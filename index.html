<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة AlameeereTv للبث المباشر</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f0f12; 
            color: #ffffff; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        .container { max-width: 850px; margin: 30px auto; padding: 10px; }
        h2 { color: #00ea87; margin-bottom: 25px; font-weight: 600; }
        .video-container { 
            position: relative; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
            background: #000;
            aspect-ratio: 16/9;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        .playlist { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            margin-top: 25px; 
            flex-wrap: wrap;
        }
        .btn { 
            background: #1e1e24; 
            color: #fff; 
            border: 2px solid #3a3a43; 
            padding: 12px 28px; 
            cursor: pointer; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn:hover { background: #2a2a35; border-color: #00ea87; }
        .btn.active { background: #00ea87; color: #000; border-color: #00ea87; }
    </style>
</head>
<body>

<div class="container">
    <h2>AlameeereTv - البث المباشر السري الآمن</h2>
    
    <div class="video-container">
        <video id="video" controls autoplay playsinline></video>
    </div>

    <div class="playlist">
        <button class="btn active" onclick="changeChannel(0, this)">القناة 1</button>
        <button class="btn" onclick="changeChannel(1, this)">القناة 2</button>
        <button class="btn" onclick="changeChannel(2, this)">القناة 3</button>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    
    const secretUrls = [
        "https://workers.dev",
        "https://workers.dev",
        "https://workers.dev"
    ];

    let hls;

    function changeChannel(index, element) {
        const streamUrl = secretUrls[index];
        
        if (Hls.isSupported()) {
            if (hls) { hls.destroy(); }
            hls = new Hls();
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }

        document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
    }

    window.onload = function() {
        changeChannel(0, document.querySelector('.btn'));
    };
</script>
</body>
</html>
