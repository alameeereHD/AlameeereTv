<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alameeere TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #0088cc;
      --error-color: #ef4444;
      --text-color: #ffffff;
      --icon-size: 85px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      padding-bottom: 30px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      background-color: rgba(15, 23, 42, 0.9);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-color);
      transition: color 0.3s ease;
    }

    .logo.error {
      color: var(--error-color);
    }

    /* Player Container */
    .player-wrapper {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 0 auto 20px auto;
      background: #000;
      aspect-ratio: 16/9;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Horizontal Scroll Sections */
    .section-title {
      padding: 10px 15px 5px 15px;
      font-size: 1.1rem;
      color: #94a3b8;
    }

    .row-container {
      display: flex;
      overflow-x: auto;
      gap: 12px;
      padding: 10px 15px;
      scrollbar-width: none;
    }

    .row-container::-webkit-scrollbar {
      display: none;
    }

    /* Standardized Icon Card Style */
    .channel-card {
      flex: 0 0 var(--icon-size);
      width: var(--icon-size);
      height: var(--icon-size);
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      border: 2px solid transparent;
      transition: transform 0.2s, border-color 0.2s;
    }

    .channel-card:active {
      transform: scale(0.95);
    }

    .channel-card.active {
      border-color: var(--accent-color);
    }

    /* Full-Bleed Logo (No Padding/No Text) */
    .channel-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div id="app-logo" class="logo">AlameeereTv</div>
  </header>

  <div class="player-wrapper" id="player-wrapper">
    <video id="video-player" controls playsinline></video>
  </div>

  <div id="channels-sections"></div>

  <script>
    // Data Structure: Channels by Rows
    const channelData = [
      {
        rowTitle: "الصف 1: الأخبار",
        channels: [
          { name: "الجزيرة", logo: "https://via.placeholder.com/150/000000/FFFFFF?text=Jazeera", url: "https://example.com/news1.m3u8" },
          { name: "العربية", logo: "https://via.placeholder.com/150/000000/FFFFFF?text=Arabiya", url: "https://example.com/news2.m3u8" },
          { name: "الحدث", logo: "https://via.placeholder.com/150/000000/FFFFFF?text=Hadath", url: "https://example.com/news3.m3u8" },
          { name: "سكاي نيوز", logo: "https://via.placeholder.com/150/000000/FFFFFF?text=SkyNews", url: "https://example.com/news4.m3u8" }
        ]
      },
      {
        rowTitle: "الصف 2: قنوات MBC",
        channels: [
          { name: "MBC 1", logo: "https://via.placeholder.com/150/000000/FFFFFF?text=MBC1", url: "https://example.com/mbc1.m3u8" },
          { name: "MBC 2", logo: "https://via.placeholder.com/150/000000/FFFFFF?text=MBC2", url: "https://example.com/mbc2.m3u8" },
          { name: "MBC 3", logo: "https://via.placeholder.com/150/000000/FFFFFF?text=MBC3", url: "https://example.com/mbc3.m3u8" },
          { name: "MBC 4", logo: "https://via.placeholder.com/150/000000/FFFFFF?text=MBC4", url: "https://example.com/mbc4.m3u8" },
          { name: "MBC Action", logo: "https://via.placeholder.com/150/000000/FFFFFF?text=Action", url: "https://example.com/mbcaction.m3u8" }
        ]
      },
      { rowTitle: "الصف 3", channels: [] },
      { rowTitle: "الصف 4", channels: [] },
      { rowTitle: "الصف 5", channels: [] },
      {
        rowTitle: "الصف 6",
        channels: [
          { name: "قناة 1", logo: "https://via.placeholder.com/150", url: "https://example.com/ch1.m3u8" },
          { name: "قناة 2", logo: "https://via.placeholder.com/150", url: "https://example.com/ch2.m3u8" },
          { name: "قناة 3", logo: "https://via.placeholder.com/150", url: "https://example.com/ch3.m3u8" },
          { name: "قناة 4", logo: "https://via.placeholder.com/150", url: "https://example.com/ch4.m3u8" },
          { name: "قناة 5", logo: "https://via.placeholder.com/150", url: "https://example.com/ch5.m3u8" },
          { name: "قناة 6", logo: "https://via.placeholder.com/150", url: "https://example.com/ch6.m3u8" },
          { name: "قناة 7", logo: "https://via.placeholder.com/150", url: "https://example.com/ch7.m3u8" }
        ]
      },
      {
        rowTitle: "الصف 7: قنوات ألوان",
        channels: [
          { name: "ألوان 1", logo: "https://via.placeholder.com/150/FF0000/FFFFFF?text=Alwan1", url: "https://example.com/alwan1.m3u8" },
          { name: "ألوان 2", logo: "https://via.placeholder.com/150/00FF00/FFFFFF?text=Alwan2", url: "https://example.com/alwan2.m3u8" },
          { name: "ألوان 3", logo: "https://via.placeholder.com/150/0000FF/FFFFFF?text=Alwan3", url: "https://example.com/alwan3.m3u8" }
        ]
      },
      {
        rowTitle: "الصف 8: قنوات ثمانية",
        channels: [
          { name: "ثمانية 1", logo: "https://via.placeholder.com/150/333333/FFFFFF?text=8-1", url: "https://example.com/8-1.m3u8" },
          { name: "ثمانية 2", logo: "https://via.placeholder.com/150/333333/FFFFFF?text=8-2", url: "https://example.com/8-2.m3u8" },
          { name: "ثمانية 3", logo: "https://via.placeholder.com/150/333333/FFFFFF?text=8-3", url: "https://example.com/8-3.m3u8" }
        ]
      }
    ];

    const video = document.getElementById('video-player');
    const logo = document.getElementById('app-logo');
    const sectionsContainer = document.getElementById('channels-sections');
    const playerWrapper = document.getElementById('player-wrapper');

    let hls = null;

    // Render UI Layout
    function buildInterface() {
      sectionsContainer.innerHTML = '';
      channelData.forEach((section) => {
        if (!section.channels || section.channels.length === 0) return;

        const title = document.createElement('div');
        title.className = 'section-title';
        title.innerText = section.rowTitle;

        const row = document.createElement('div');
        row.className = 'row-container';

        section.channels.forEach((ch) => {
          const card = document.createElement('div');
          card.className = 'channel-card';

          const img = document.createElement('img');
          img.src = ch.logo;
          img.alt = ch.name;

          card.appendChild(img);
          card.onclick = () => playStream(ch.url, card);
          row.appendChild(card);
        });

        sectionsContainer.appendChild(title);
        sectionsContainer.appendChild(row);
      });
    }

    // Initialize Stream Playback
    function playStream(streamUrl, cardElement) {
      document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
      if (cardElement) cardElement.classList.add('active');

      logo.classList.remove('error');

      if (Hls.isSupported()) {
        if (hls) hls.destroy();

        hls = new Hls({
          startLevel: 0, // Starts at lowest quality
          capLevelToPlayerSize: true
        });

        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
        });

        // Toggle error color ONLY on actual video play failure
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            logo.classList.add('error');
          }
        });

      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.addEventListener('loadedmetadata', () => video.play());
      }
    }

    // Gestures Handling (Double Click / Tap)
    let lastTap = 0;
    playerWrapper.addEventListener('click', (e) => {
      const now = new Date().getTime();
      const timespan = now - lastTap;

      if (timespan < 300 && timespan > 0) {
        // Double Click/Tap Event
        e.preventDefault();
        const rect = playerWrapper.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const width = rect.width;

        if (clickX < width * 0.35) {
          // Left side: Rewind 10s
          video.currentTime = Math.max(0, video.currentTime - 10);
        } else if (clickX > width * 0.65) {
          // Right side: Fast-Forward 10s
          video.currentTime = Math.min(video.duration, video.currentTime + 10);
        } else {
          // Center: Fullscreen Toggle
          if (!document.fullscreenElement) {
            playerWrapper.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        }
      }
      lastTap = now;
    });

    buildInterface();
  </script>
</body>
</html>
