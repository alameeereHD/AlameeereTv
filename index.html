<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة AlameeereTv للبث المباشر</title>
    <!-- استدعاء مكتبة مشغل الفيديو المتطور Video.js -->
    <link href="https://zencdn.net" rel="stylesheet" />
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f0f12; 
            color: #ffffff; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        .container { max-width: 850px; margin: 30px auto; padding: 10px; }
        h2 { color: #00ea87; margin-bottom: 25px; font-weight: 600; }
        .video-container { 
            position: relative; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
            background: #000;
        }
        .playlist { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            margin-top: 25px; 
            flex-wrap: wrap;
        }
        .btn { 
            background: #1e1e24; 
            color: #fff; 
            border: 2px solid #3a3a43; 
            padding: 12px 28px; 
            cursor: pointer; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn:hover { background: #2a2a35; border-color: #00ea87; }
        .btn.active { background: #00ea87; color: #000; border-color: #00ea87; }
    </style>
</head>
<body>

<div class="container">
    <h2>AlameeereTv - البث المباشر السري الآمن</h2>
    
    <!-- شاشة مشغل الفيديو -->
    <div class="video-container">
        <video id="alameeere-player" class="video-js vjs-default-skin vjs-16-9 vjs-big-play-centered" controls preload="auto" width="100%">
            <p class="vjs-no-js">المتصفح لا يدعم التشغيل، يرجى تحديثه.</p>
        </video>
    </div>

    <!-- أزرار التنقل السري بين القنوات بالحروف المشفرة -->
    <div class="playlist">
        <button class="btn active" onclick="changeChannel(0, this)">القناة 1</button>
        <button class="btn" onclick="changeChannel(1, this)">القناة 2</button>
        <button class="btn" onclick="changeChannel(2, this)">القناة 3</button>
    </div>
</div>

<!-- استدعاء ملفات تشغيل الفيديو لبث HLS (.m3u8) -->
<script src="https://zencdn.net"></script>
<script>
    const player = videojs('alameeere-player');

    // الروابط السحرية المشفرة بالحروف عبر البروكسي الخاص بك
    const secretUrls = [
        "https://workers.dev", // القناة 1
        "https://workers.dev", // القناة 2
        "https://workers.dev"  // القناة 3
    ];

    function changeChannel(index, element) {
        player.src({
            src: secretUrls[index],
            type: 'application/x-mpegURL'
        });
        player.play();

        document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
    }

    window.onload = function() {
        changeChannel(0, document.querySelector('.btn'));
    };
</script>
</body>
</html>
