        opt.value = i;
        opt.textContent = ch.name;
        channelSelect.appendChild(opt);
    });

    // ===================== دوال =====================
    function setStatus(text, type = 'loading') {
        if (!text) { statusMsg.style.display = 'none'; spinner.style.display = 'none'; return; }
        statusMsg.style.display = 'block';
        statusMsg.textContent = text;
        statusMsg.className = 'status-msg ' + type;
        spinner.style.display = (type === 'loading') ? 'block' : 'none';
    }

    function hideUI() { overlay.classList.add('hidden'); }
    function showUI() {
        overlay.classList.remove('hidden');
        clearTimeout(uiTimeout);
        uiTimeout = setTimeout(() => { if (!video.paused && !isLocked) hideUI(); }, 4000);
    }

    function destroyPlayers() {
        if (dashPlayer) { dashPlayer.destroy(); dashPlayer = null; }
        if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
        if (mpegtsPlayer) { mpegtsPlayer.destroy(); mpegtsPlayer = null; }
        video.pause();
        video.removeAttribute('src');
        video.load();
        timelineProgress.style.width = '0%';
        timeText.textContent = '00:00 / 00:00';
        playIcon.className = 'fas fa-play';
        video.playbackRate = 1.0;
        btnSpeed.textContent = '1x';
        qualityMenu.style.display = 'none';
        setStatus('');
    }

    // ===================== المحرك الذكي =====================
    function loadStream(url) {
        destroyPlayers();
        setStatus('⏳ جارٍ التحميل...', 'loading');
        showUI();

        let cleanUrl = url.split('|')[0];
        const low = cleanUrl.toLowerCase();

        // DASH
        if (low.includes('.mpd')) {
            dashPlayer = dashjs.MediaPlayer().create();
            dashPlayer.initialize(video, cleanUrl, true);
            dashPlayer.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, () => {
                setStatus('');
                video.play().catch(() => {});
                setTimeout(setupDashQualities, 1500);
            });
            dashPlayer.on(dashjs.MediaPlayer.events.ERROR, () => setStatus('❌ خطأ في البث DASH', 'error'));
            return;
        }

        // HLS
        if (low.includes('.m3u8')) {
            // تشغيل أصلي (Safari)
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = cleanUrl;
                video.addEventListener('loadedmetadata', function onMeta() {
                    setStatus('');
                    video.play().catch(() => {});
                    qualityMenu.innerHTML = '<button class="active">تلقائي</button>';
                    video.removeEventListener('loadedmetadata', onMeta);
                });
                video.addEventListener('error', () => setStatus('❌ فشل التشغيل الأصلي', 'error'));
                return;
            }

            // HLS.js
            if (Hls.isSupported()) {
                hlsPlayer = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    xhrSetup: function(xhr, xhrUrl) {
                        xhr.withCredentials = true;
                        try { xhr.setRequestHeader('User-Agent', 'Mozilla/5.0 (QtEmbedded; U; Linux; C) IPTV'); } catch(e) {}
                    }
                });
                hlsPlayer.loadSource(cleanUrl);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                    setStatus('');
                    video.play().catch(() => {});
                    setupHlsQualities();
                });
                hlsPlayer.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        setStatus('⚠️ فشل HLS.js، محاولة مباشر...', 'loading');
                        video.src = cleanUrl;
                        video.load();
                        video.play().catch(() => setStatus('❌ فشل التشغيل (CORS أو رابط منتهي)', 'error'));
                    }
                });
                return;
            }
        }

        // MPEG-TS / FLV
        if (low.includes('.ts') || low.includes('.flv') || (typeof mpegts !== 'undefined' && mpegts.JSPlayer && mpegts.JSPlayer.isSupported())) {
            if (typeof mpegts !== 'undefined' && mpegts.JSPlayer && mpegts.JSPlayer.isSupported()) {
                let type = low.includes('.flv') ? 'flv' : 'mse';
                try {
                    mpegtsPlayer = mpegts.createPlayer({
                        type: type,
                        isLive: true,
                        url: cleanUrl,
                        withCredentials: true
                    });
                    mpegtsPlayer.attachMediaElement(video);
                    mpegtsPlayer.load();
                    mpegtsPlayer.play().then(() => {
                        setStatus('');
                    }).catch((err) => {
                        console.error('MPEGTS play error:', err);
                        setStatus('⚠️ فشل تشغيل MPEGTS', 'error');
                    });
                    qualityMenu.innerHTML = '<button class="active">تلقائي</button>';
                } catch(e) {
                    console.error('MPEGTS create error:', e);
                    setStatus('❌ خطأ في MPEGTS', 'error');
                }
                return;
            }
        }

        // باقي الصيغ
        video.src = cleanUrl;
        video.load();
        video.addEventListener('loadedmetadata', () => {
            setStatus('');
            video.play().catch(() => {});
            qualityMenu.innerHTML = '<button class="active">تلقائي</button>';
        });
        video.addEventListener('error', () => setStatus('❌ فشل التحميل العام', 'error'));
    }

    // ===================== جودات DASH و HLS =====================
    function setupDashQualities() {
        let bitrates = dashPlayer.getBitrateInfoListFor('video');
        if (!bitrates || bitrates.length <= 1) { qualityMenu.innerHTML = '<button class="active">تلقائي</button>'; return; }
        qualityMenu.innerHTML = '<button class="active" id="q-auto">تلقائي</button>';
        bitrates.sort((a, b) => b.height - a.height);
        let seen = new Set();
        bitrates.forEach(info => {
            if (!seen.has(info.height) && info.height > 0) {
                seen.add(info.height);
                let btn = document.createElement('button');
                btn.textContent = info.height + 'p';
                btn.onclick = () => { dashPlayer.setQualityFor('video', info.index); dashPlayer.setAutoSwitchQualityFor('video', false); updateQualityActive(btn); };
                qualityMenu.appendChild(btn);
            }
        });
        document.getElementById('q-auto').onclick = () => { dashPlayer.setAutoSwitchQualityFor('video', true); updateQualityActive(document.getElementById('q-auto')); };
    }

    function setupHlsQualities() {
        let levels = hlsPlayer.levels;
        if (!levels || levels.length <= 1) { qualityMenu.innerHTML = '<button class="active">تلقائي</button>'; return; }
        qualityMenu.innerHTML = '<button class="active" id="q-auto">تلقائي</button>';
        levels.forEach((level, idx) => {
            let btn = document.createElement('button');
            btn.textContent = (level.height ? level.height : 'جودة ' + idx) + 'p';
            btn.onclick = () => { hlsPlayer.currentLevel = idx; updateQualityActive(btn); };
            qualityMenu.appendChild(btn);
        });
        document.getElementById('q-auto').onclick = () => { hlsPlayer.currentLevel = -1; updateQualityActive(document.getElementById('q-auto')); };
    }

    function updateQualityActive(active) {
        document.querySelectorAll('.quality-dropdown button').forEach(b => b.classList.remove('active'));
        active.classList.add('active');
        qualityMenu.style.display = 'none';
    }

    // ===================== قياس الشاشة =====================
    function cycleAspect() {
        aspectIndex = (aspectIndex + 1) % aspectModes.length;
        video.style.objectFit = aspectModes[aspectIndex];
        btnAspect.textContent = aspectIcons[aspectIndex];
        btnAspect.title = 'قياس: ' + aspectModes[aspectIndex];
        showUI();
    }
    function setAspectMode(mode) {
        let idx = aspectModes.indexOf(mode);
        if (idx !== -1) { aspectIndex = idx; video.style.objectFit = mode; btnAspect.textContent = aspectIcons[idx]; btnAspect.title = 'قياس: ' + mode; }
    }

    // ===================== أحداث التحكم =====================
    let currentIndex = 0;
    function loadChannel(index) {
        currentIndex = index;
        loadStream(channels[index].url);
        qualityMenu.style.display = 'none';
        showUI();
        setAspectMode('contain');
    }
    channelSelect.addEventListener('change', function() { loadChannel(parseInt(this.value)); });

    function togglePlay() {
        if (video.paused) { video.play().catch(() => {}); playIcon.className = 'fas fa-pause'; } 
        else { video.pause(); playIcon.className = 'fas fa-play'; }
        showUI();
    }
    btnPlay.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
    video.addEventListener('click', () => {
        if (overlay.classList.contains('hidden')) showUI();
        else if (!isLocked) togglePlay();
    });
    video.addEventListener('dblclick', (e) => {
        e.preventDefault(); e.stopPropagation();
        if (isLocked) return;
        setAspectMode(aspectModes[aspectIndex] === 'contain' ? 'cover' : 'contain');
        showUI();
    });

    video.addEventListener('timeupdate', () => {
        if (video.duration && isFinite(video.duration)) {
            let pct = (video.currentTime / video.duration) * 100;
            timelineProgress.style.width = pct + '%';
            let cm = Math.floor(video.currentTime/60), cs = Math.floor(video.currentTime%60);
            let dm = Math.floor(video.duration/60), ds = Math.floor(video.duration%60);
            timeText.textContent = `${String(cm).padStart(2,'0')}:${String(cs).padStart(2,'0')} / ${String(dm).padStart(2,'0')}:${String(ds).padStart(2,'0')}`;
        } else {
            let m = Math.floor(video.currentTime/60), s = Math.floor(video.currentTime%60);
            timeText.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} • مباشر`;
        }
    });

    timelineArea.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isLocked) return;
        if (video.duration && isFinite(video.duration)) {
            let rect = timelineArea.getBoundingClientRect();
            let x = (e.clientX - rect.left) / rect.width;
            video.currentTime = x * video.duration;
        }
        showUI();
    });

    btnMute.addEventListener('click', (e) => { e.stopPropagation(); video.muted = !video.muted; volumeIcon.className = video.muted ? 'fas fa-volume-xmark' : 'fas fa-volume-high'; showUI(); });
    btnSpeed.addEventListener('click', (e) => {
        e.stopPropagation();
        let rates = [1.0, 1.5, 2.0];
        let idx = rates.indexOf(video.playbackRate);
        if (idx === -1) idx = 0;
        let next = rates[(idx + 1) % rates.length];
        video.playbackRate = next;
        btnSpeed.textContent = next + 'x';
        showUI();
    });
    btnLock.addEventListener('click', (e) => {
        e.stopPropagation();
        isLocked = !isLocked;
        btnLock.innerHTML = isLocked ? '<i class="fas fa-lock"></i>' : '<i class="fas fa-lock-open"></i>';
        wrapper.classList.toggle('locked', isLocked);
        showUI();
    });
    btnFullscreen.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!document.fullscreenElement) {
            wrapper.requestFullscreen().then(() => { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); }).catch(() => {});
        } else { document.exitFullscreen(); if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }
        showUI();
    });
    document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); });
    btnPip.addEventListener('click', (e) => { e.stopPropagation(); if (video !== document.pictureInPictureElement) video.requestPictureInPicture(); else document.exitPictureInPicture(); showUI(); });
    btnQuality.addEventListener('click', (e) => { e.stopPropagation(); qualityMenu.style.display = qualityMenu.style.display === 'flex' ? 'none' : 'flex'; showUI(); });
    btnAspect.addEventListener('click', (e) => { e.stopPropagation(); cycleAspect(); });
    wrapper.addEventListener('mousemove', showUI);
    wrapper.addEventListener('touchstart', showUI);

    loadChannel(0);
</script>
</body>
</html>
