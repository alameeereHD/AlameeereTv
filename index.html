(function () {
  var hls = null;
  var cur = { r: -1, i: -1 };
  var retryT = null;
  var curEvtUrl = null;
  var curPlayUrl = null;
  var curPlayName = '';
  var retryCount = 0;
  var MAX_RETRIES = 3;

  var vid = document.getElementById('vid');
  var ifw = document.getElementById('iframe-wrap');
  var ifp = document.getElementById('iframe-player');
  var qm = document.getElementById('qm');
  var qBtn = document.getElementById('q-btn');
  var loader = document.getElementById('loader');
  var chTitle = document.getElementById('ch-title');
  var dblHint = document.getElementById('dbl-hint');
  var dblTxt = document.getElementById('dbl-txt');
  var swInd = document.getElementById('swipe-ind');
  var siIcon = document.getElementById('si-icon');
  var siBar = document.getElementById('si-bar');
  var siLabel = document.getElementById('si-label');
  var brightL = document.getElementById('brightness-layer');
  var pw = document.getElementById('player-wrap');
  var chRows = document.getElementById('ch-rows');
  var fitBtn = document.getElementById('fit-btn');
  var speedBadge = document.getElementById('speed-badge');
  var spdBtn = document.getElementById('spd-btn');
  var brandOverlay = document.getElementById('brand-overlay');
  var muteBtn = document.getElementById('mute-btn');
  var volSlider = document.getElementById('vs');

  var brightness = parseFloat(localStorage.getItem('brightness') || '0');
  brightL.style.opacity = brightness;

  var ASPECTS = [
    { cls: 'fc', lbl: '↕ عادي' },
    { cls: 'fv', lbl: '⛶ ملء' },
    { cls: 'ff', lbl: '↔ مفيد' }
  ];
  var aIdx = parseInt(localStorage.getItem('aIdx') || '0', 10);

  var speedOn = localStorage.getItem('speedOn') !== '0';
  var isTesting = false;
  var spInt = null;
  var uIdx = 0;
  var TU = [
    'https://httpbin.org/bytes/200000',
    'https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/PNG_transparency_demonstration_1.png/240px-PNG_transparency_demonstration_1.png'
  ];

  var swT = null;
  var swSV = 0;
  var swTm = null;
  var isSwiping = false;
  var tyS = 0;
  var lTap = 0;
  var dblT = null;
  var dblHT = null;
  var hCtrl = null;

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function clearChannelActive() {
    $all('.ch.channel-active, .multi-card.channel-active, .event-card.channel-active').forEach(function (node) {
      node.classList.remove('channel-active');
    });
  }

  function setChannelActive(node) {
    clearChannelActive();
    if (node) node.classList.add('channel-active');
  }

  function channelLoading() {
    brandOverlay.classList.add('loading');
    brandOverlay.style.opacity = '1';
    brandOverlay.style.zIndex = '50';
  }

  function channelWorking() {
    brandOverlay.classList.remove('loading');
    brandOverlay.style.opacity = '0';
    brandOverlay.style.zIndex = '-1';
    pw.classList.add('playing');
  }

  function applyAspect(i) {
    vid.className = ASPECTS[i].cls;
    fitBtn.textContent = ASPECTS[i].lbl;
    fitBtn.classList.toggle('on', i !== 0);
    localStorage.setItem('aIdx', i);
  }

  function cycleAspect() {
    aIdx = (aIdx + 1) % 3;
    applyAspect(aIdx);
  }

  function setFUI(full) {
    chRows.style.display = full ? 'none' : 'flex';
    if (!full && screen.orientation && screen.orientation.unlock) {
      screen.orientation.unlock();
    }
  }

  function doFullscreen() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      setFUI(false);
      return;
    }
    var root = document.documentElement;
    var req = root.requestFullscreen
      ? root.requestFullscreen()
      : root.webkitRequestFullscreen
        ? root.webkitRequestFullscreen()
        : null;
    Promise.resolve(req).then(function () {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function () {});
      }
      setFUI(true);
    }).catch(function () {
      setFUI(true);
    });
  }

  function runSpeedTest() {
    if (isTesting) return;
    isTesting = true;
    speedBadge.textContent = '📡 ...';
    var url = TU[uIdx % TU.length] + '?r=' + Date.now();
    var t0 = Date.now();
    fetch(url, { cache: 'no-store' })
      .then(function (res) { return res.blob(); })
      .then(function (blob) {
        showSpeed(((blob.size || 200000) * 8) / ((Date.now() - t0) / 1000));
        isTesting = false;
      })
      .catch(function () {
        uIdx += 1;
        isTesting = false;
      });
  }

  function showSpeed(bits) {
    speedBadge.textContent = bits >= 1e6
      ? '📡 ' + (bits / 1e6).toFixed(1) + ' Mbps'
      : '📡 ' + Math.round(bits / 1000) + ' Kbps';
    speedBadge.style.color = bits >= 1e7 ? '#0f0' : bits >= 2e6 ? '#ff0' : bits >= 5e5 ? '#f80' : '#f44';
  }

  function applySpeedVis() {
    speedBadge.classList.toggle('hide', !speedOn);
    spdBtn.classList.toggle('on', speedOn);
    if (speedOn) {
      if (!spInt) {
        runSpeedTest();
        spInt = setInterval(runSpeedTest, 15000);
      }
    } else if (spInt) {
      clearInterval(spInt);
      spInt = null;
    }
  }

  function toggleSpeed() {
    speedOn = !speedOn;
    localStorage.setItem('speedOn', speedOn ? '1' : '0');
    applySpeedVis();
  }

  function showLoader() { loader.style.display = 'flex'; }
  function hideLoader() { loader.style.display = 'none'; }

  // ============================================================
  // الفتح الخارجي المباشر لقنوات TS
  // ============================================================
  function toIntentUrl(streamUrl) {
    try {
      var u = new URL(streamUrl);
      return 'intent://' + u.host + u.pathname + u.search +
        '#Intent;scheme=' + u.protocol.replace(':', '') +
        ';action=android.intent.action.VIEW;type=video/*;end';
    } catch (err) {
      return 'intent:' + streamUrl + '#Intent;action=android.intent.action.VIEW;type=video/*;end';
    }
  }

  function isIOS() {
    return /iPhone|iPad|iPod/i.test(navigator.userAgent);
  }

  function openExternalDirect(url) {
    if (!url) return;
    if (isIOS()) {
      window.location.href = 'vlc://' + url;
    } else {
      window.location.href = toIntentUrl(url);
    }
  }

  // ============================================================

  function reloadCurrentStream() {
    if (ifw.style.display === 'block' && curPlayUrl) {
      ifp.src = '';
      setTimeout(function() { ifp.src = curPlayUrl; }, 400);
      return;
    }
    if (curPlayUrl) playChannel(curPlayUrl, curPlayName);
    else if (curEvtUrl) startHls(curEvtUrl);
    else if (cur.r >= 0) load(cur.r, cur.i);
  }

  function startHls(rawUrl) {
    var url = rawUrl;

    retryCount = 0;
    channelLoading();
    vid.style.display = 'block';
    ifw.style.display = 'none';
    ifp.src = '';
    showLoader();
    destroyHls();
    vid.removeAttribute('src');
    vid.load();

    var started = false;

    function onStarted() {
      if (started) return;
      started = true;
      retryCount = 0;
      clearTimeout(retryT);
      retryT = null;
      hideLoader();
      channelWorking();
    }

    if (Hls.isSupported()) {
      hls = new Hls({
        enableWorker: true,
        startLevel: 0,
        autoStartLoad: true,
        capLevelToPlayerSize: false,
        maxAutoLevel: -1,
        maxBufferLength: 10,
        maxMaxBufferLength: 30,
        manifestLoadingMaxRetry: 3,
        fragLoadingMaxRetry: 3,
        liveSyncDurationCount: 2,
        lowLatencyMode: true,
        backBufferLength: 30
      });
      hls.loadSource(url);
      hls.attachMedia(vid);

      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        if (!qBuilt) { buildQ(); qBuilt = true; }
        if (hls.levels && hls.levels.length) {
          hls.autoLevelEnabled = false;
          hls.currentLevel = 0;
        }
        vid.play().catch(function () {});
      });

      hls.on(Hls.Events.FRAG_BUFFERED, onStarted);

      hls.on(Hls.Events.ERROR, function (e, d) {
        if (!d || !d.fatal) return;

        if (d.type === Hls.ErrorTypes.MEDIA_ERROR) {
          try { hls.recoverMediaError(); } catch (err) {}
          return;
        }

        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
          if (!started) {
            try { hls.startLoad(); } catch (err) {}
          } else {
            if (retryCount++ >= MAX_RETRIES) return;
            showLoader();
            clearTimeout(retryT);
            retryT = setTimeout(reloadCurrentStream, 5000);
          }
          return;
        }

        if (started) {
          if (retryCount++ >= MAX_RETRIES) return;
          clearTimeout(retryT);
          retryT = setTimeout(reloadCurrentStream, 5000);
        }
      });
      return;
    }

    if (vid.canPlayType('application/vnd.apple.mpegurl')) {
      vid.src = url;
      vid.addEventListener('loadeddata', onStarted, { once: true });
      vid.play().catch(function () {});
    }
  }

  function playIframe(url) {
    destroyHls();
    vid.style.display = 'none';
    ifw.style.display = 'block';
    showLoader();
    ifp.src = url;
    channelWorking();
    setTimeout(hideLoader, 1500);
  }

  function playChannel(target, name, cardNode) {
    curPlayUrl = target;
    curPlayName = name || '';
    curEvtUrl = null;
    cur = { r: -1, i: -1 };
    chTitle.textContent = name || '';
    chTitle.style.display = 'block';
    setChannelActive(cardNode || null);

    if (typeof target === 'string' && (target.indexOf('http') === 0 && target.indexOf('.m3u8') === -1 && target.indexOf('.ts') === -1)) {
      playIframe(target);
      return;
    }
    startHls(target);
  }

  function load(r, i, node) {
    cur.r = r; cur.i = i;
    curEvtUrl = null;
    curPlayUrl = null;
    curPlayName = '';
    var ch = ROWS[r].channels[i];
    chTitle.textContent = ch.n;
    chTitle.style.display = 'block';
    setChannelActive(node || null);

    if (ch.t === 'iframe') playIframe(ch.u);
    else startHls(ch.u);
  }

  function buildQ() {
    qm.innerHTML = '';
    var btnAuto = el('button', 'active', 'تلقائي');
    btnAuto.onclick = function () {
      if (hls) hls.currentLevel = -1;
      qBtn.classList.remove('manual');
      qBtn.textContent = 'جودة';
      $all('button', qm).forEach(function (b) { b.classList.remove('active'); });
      btnAuto.classList.add('active');
      qm.classList.remove('open');
    };
    qm.appendChild(btnAuto);

    if (!hls || !hls.levels) return;
    hls.levels.forEach(function (lv, idx) {
      var name = lv.height ? lv.height + 'p' : 'جودة ' + (idx + 1);
      var b = el('button', '', name);
      b.onclick = function () {
        if (hls) hls.currentLevel = idx;
        qBtn.classList.add('manual');
        qBtn.textContent = name;
        $all('button', qm).forEach(function (btn) { btn.classList.remove('active'); });
        b.classList.add('active');
        qm.classList.remove('open');
      };
      qm.appendChild(b);
    });
  }

  function initUI() {
    applyAspect(aIdx);
    applySpeedVis();

    vid.addEventListener('play', function () {
      $('#play-btn').textContent = '⏸';
      channelWorking();
    });
    vid.addEventListener('pause', function () { $('#play-btn').textContent = '▶'; });
    vid.addEventListener('volumechange', function () {
      volSlider.value = vid.muted ? 0 : vid.volume;
      muteBtn.textContent = (vid.muted || vid.volume === 0) ? '🔇' : '🔊';
    });

    $('#play-btn').onclick = function () { if (vid.paused) vid.play(); else vid.pause(); };
    muteBtn.onclick = function () { vid.muted = !vid.muted; };
    volSlider.oninput = function () { vid.volume = parseFloat(this.value); vid.muted = (vid.volume === 0); };

    $('#skip-back-btn').onclick = function () { vid.currentTime = Math.max(0, vid.currentTime - 10); };
    $('#skip-fwd-btn').onclick = function () { vid.currentTime += 10; };
    fitBtn.onclick = cycleAspect;
    spdBtn.onclick = toggleSpeed;
    speedBadge.onclick = runSpeedTest;
    $('#fs-btn').onclick = doFullscreen;
    $('#reload-btn').onclick = reloadCurrentStream;

    qBtn.onclick = function (e) { e.stopPropagation(); qm.classList.toggle('open'); };
    document.addEventListener('click', function () { qm.classList.remove('open'); });

    // Render standard rows
    ROWS.forEach(function (row, rIdx) {
      var container = $('#row-' + rIdx);
      if (!container) return;
      row.channels.forEach(function (ch, cIdx) {
        var btn = el('button', 'ch', ch.n);
        if (ch.t === 'iframe') btn.classList.add('iframe-ch');
        if (ch.t === 'ts') btn.classList.add('ts-ch');
        btn.onclick = function () {
          if (ch.t === 'ts') {
            setChannelActive(btn);
            openExternalDirect(ch.u);
            return;
          }
          load(rIdx, cIdx, btn);
        };
        container.appendChild(btn);
      });
    });

    // Render beIN row
    var beinRow = $('#row-bein');
    if (beinRow) {
      BEIN_CH.forEach(function (item, idx) {
        var card = el('div', 'multi-card bein-style');
        if (item.isNew) card.classList.add('new-ch');

        var lw = el('div', 'lw');
        var img = el('img');
        img.src = item.logo;
        lw.appendChild(img);
        if (item.num) {
          var cn = el('span', 'cn', item.num);
          lw.appendChild(cn);
        }
        card.appendChild(lw);

        var qRow = el('div', 'q-row');
        var isExternalCard = idx >= 6;

        if (item.single) {
          var b = el('button', '', 'تشغيل');
          b.onclick = function (e) {
            e.stopPropagation();
            playChannel(item.single, item.name, card);
          };
          qRow.appendChild(b);
        } else {
          ['sd', 'hd', 'uhd'].forEach(function (q) {
            if (item[q]) {
              var b = el('button', '', q.toUpperCase());
              b.onclick = function (e) {
                e.stopPropagation();
                if (isExternalCard) {
                  setChannelActive(card);
                  openExternalDirect(item[q]);
                  return;
                }
                playChannel(item[q], item.name + ' (' + q.toUpperCase() + ')', card);
              };
              qRow.appendChild(b);
            }
          });
        }
        card.appendChild(qRow);
        card.onclick = function () {
          if (isExternalCard) {
            var t = item.uhd || item.hd || item.sd;
            if (t) {
              setChannelActive(card);
              openExternalDirect(t);
            }
            return;
          }
          var target = item.single || item.hd || item.uhd || item.sd;
          if (target) playChannel(target, item.name, card);
        };
        beinRow.appendChild(card);
      });
    }

    // Render Alwan row
    var alwanRow = $('#row-alwan');
    if (alwanRow) {
      ALWAN_CH.forEach(function (item, idx) {
        var card = el('div', 'multi-card alwan-style');
        if (item.isNew) card.classList.add('new-ch');

        var lw = el('div', 'lw');
        var img = el('img');
        img.src = item.logo;
        lw.appendChild(img);
        if (item.num) {
          var cn = el('span', 'cn', item.num);
          lw.appendChild(cn);
        }
        card.appendChild(lw);

        var qRow = el('div', 'q-row');
        var isInternalCard = idx < 3;

        if (item.levels) {
          if (!isInternalCard) {
            item.levels.forEach(function (lv) {
              var b = el('button', '', lv.label);
              b.onclick = function (e) {
                e.stopPropagation();
                openExternalDirect(lv.url);
              };
              qRow.appendChild(b);
            });
          }
        } else {
          ['sd', 'hd', 'uhd'].forEach(function (q) {
            if (item[q]) {
              var b = el('button', '', q.toUpperCase());
              b.onclick = function (e) {
                e.stopPropagation();
                setChannelActive(card);
                openExternalDirect(item[q]);
              };
              qRow.appendChild(b);
            }
          });
        }
        card.appendChild(qRow);
        card.onclick = function () {
          if (isInternalCard && item.levels) {
            playChannel({ levels: item.levels }, item.name, card);
            return;
          }
          var target = (item.levels && item.levels[0]) ? item.levels[0].url : (item.uhd || item.hd || item.sd);
          if (target) {
            setChannelActive(card);
            openExternalDirect(target);
          }
        };
        alwanRow.appendChild(card);
      });
    }

    // Render Thmanyah row
    var thmRow = $('#row-thm');
    if (thmRow) {
      THM_CH.forEach(function (item, idx) {
        var card = el('div', 'multi-card thm-style');
        if (item.isNew) card.classList.add('new-ch');

        var lw = el('div', 'lw');
        var img = el('img');
        img.src = item.logo;
        lw.appendChild(img);
        if (item.num) {
          var cn = el('span', 'cn', item.num);
          lw.appendChild(cn);
        }
        card.appendChild(lw);

        var qRow = el('div', 'q-row');
        var isInternalCard = idx < 3;

        if (item.levels) {
          if (!isInternalCard) {
            item.levels.forEach(function (lv) {
              var b = el('button', '', lv.label);
              b.onclick = function (e) {
                e.stopPropagation();
                openExternalDirect(lv.url);
              };
              qRow.appendChild(b);
            });
          }
        } else {
          ['sd', 'hd', 'uhd'].forEach(function (q) {
            if (item[q]) {
              var b = el('button', '', q.toUpperCase());
              b.onclick = function (e) {
                e.stopPropagation();
                setChannelActive(card);
                openExternalDirect(item[q]);
              };
              qRow.appendChild(b);
            }
          });
        }
        card.appendChild(qRow);
        card.onclick = function () {
          if (isInternalCard && item.levels) {
            playChannel({ levels: item.levels }, item.name, card);
            return;
          }
          var target = (item.levels && item.levels[0]) ? item.levels[0].url : (item.uhd || item.hd || item.sd);
          if (target) {
            setChannelActive(card);
            openExternalDirect(target);
          }
        };
        thmRow.appendChild(card);
      });
    }

    // Touch Controls for Brightness & Volume
    pw.addEventListener('touchstart', function (e) {
      if (e.touches.length === 1) {
        swT = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        isSwiping = false;
        var rect = pw.getBoundingClientRect();
        tyS = (swT.x - rect.left < rect.width / 2) ? 'bright' : 'vol';
        swSV = (tyS === 'bright') ? brightness : vid.volume;
      }
    }, { passive: true });

    pw.addEventListener('touchmove', function (e) {
      if (!swT || e.touches.length !== 1) return;
      var dx = e.touches[0].clientX - swT.x;
      var dy = e.touches[0].clientY - swT.y;
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) {
        isSwiping = true;
        var delta = -dy / 150;
        if (tyS === 'bright') {
          brightness = Math.min(0.85, Math.max(0, swSV + delta));
          brightL.style.opacity = brightness;
          localStorage.setItem('brightness', brightness);
          siIcon.textContent = '☀️';
          siBar.style.width = Math.round((1 - brightness / 0.85) * 100) + '%';
          siLabel.textContent = 'السطوع';
        } else {
          var nv = Math.min(1, Math.max(0, swSV + delta));
          vid.volume = nv;
          volSlider.value = nv;
          siIcon.textContent = nv === 0 ? '🔇' : '🔊';
          siBar.style.width = Math.round(nv * 100) + '%';
          siLabel.textContent = 'الصوت';
        }
        swInd.style.display = 'flex';
        clearTimeout(swTm);
        swTm = setTimeout(function () { swInd.style.display = 'none'; }, 1000);
      }
    }, { passive: true });

    pw.addEventListener('touchend', function () {
      swT = null;
    });

    // النقر على المشغل - إصلاح كامل لـ Android
    function handleDoubleTap() {
      doFullscreen();
      dblTxt.textContent = (document.fullscreenElement || document.webkitFullscreenElement) ? 'Exit' : '⛶';
      dblHint.classList.add('show');
      clearTimeout(dblHT);
      dblHT = setTimeout(function () { dblHint.classList.remove('show'); }, 600);
    }

    function handleSingleTap() {
      dblT = setTimeout(function () {
        pw.classList.toggle('show-ctrl');
        clearTimeout(hCtrl);
        if (pw.classList.contains('show-ctrl')) {
          hCtrl = setTimeout(function () { pw.classList.remove('show-ctrl'); }, 4000);
        }
      }, 280);
    }

    pw.addEventListener('touchend', function (e) {
      if (e.target.closest('#controls-overlay') || e.target.closest('#speed-badge')) return;
      if (isSwiping) return;

      var now = Date.now();
      if (now - lTap < 300 && now - lTap > 30) {
        clearTimeout(dblT);
        dblT = null;
        e.preventDefault();
        handleDoubleTap();
        lTap = 0;
        return;
      }

      lTap = now;
      clearTimeout(dblT);
      handleSingleTap();
    }, { passive: false });

    pw.addEventListener('click', function (e) {
      if (e.target.closest('#controls-overlay') || e.target.closest('#speed-badge')) return;
      if ('ontouchstart' in window) return;

      var now = Date.now();
      if (now - lTap < 300) {
        clearTimeout(dblT);
        dblT = null;
        handleDoubleTap();
        lTap = 0;
      } else {
        lTap = now;
        clearTimeout(dblT);
        handleSingleTap();
      }
    });

    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  }

  document.addEventListener('DOMContentLoaded', initUI);
})();
</script>
</body>
</html>
