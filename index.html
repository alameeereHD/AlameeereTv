<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- إجبار ترقية الروابط غير الآمنة لتفادي حظر كروم -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>AlameeereTv</title>
    <!-- استدعاء مكتبة Hls.js لتمكين مشغل الكروم من قراءة ملفات m3u8 -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #app { display: flex; flex-direction: column; width: 100%; height: 100%; }

        #player-wrap {
            flex: 0 0 40%;
            min-height: 200px;
            position: relative;
            user-select: none;
            overflow: hidden;
            background: #000;
        }
        video { width: 100%; height: 100%; display: block; background: #000; }
        video.fc { object-fit: contain; }
        video.fv { object-fit: fill; }
        video.ff { object-fit: contain; transform: scaleY(0.72); transform-origin: center center; }

        #brand-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 50;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        #brand-overlay span {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        #player-wrap.playing #brand-overlay {
            opacity: 0;
            z-index: -1;
        }

        #ch-rows {
            flex: 1 1 0;
            min-height: 0;
            background: #030303;
            border-top: 1px solid #111;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 2px 0;
        }
        .ch-row {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #0a0a0a;
            padding: 2px 0;
        }
        .row-label {
            flex-shrink: 0;
            width: 60px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: #050505;
            border-left: 1px solid #111;
            padding: 5px;
        }
        .row-label .ico { font-size: 14px; }
        .row-label .lbl { font-size: 9px; color: #666; font-weight: 700; text-align: center; }
        .row-scroll {
            flex: 1;
            display: flex;
            gap: 4px;
            padding: 4px;
            overflow-x: auto;
            align-items: center;
        }
        .row-scroll::-webkit-scrollbar { height: 3px; }
        .row-scroll::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }
        .ch {
            min-width: 85px;
            height: 40px;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            color: #bbb;
            font-size: 11px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: .2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2px;
        }
        .ch:hover, .ch.active { background: #151; color: #0f0; border-color: #0f0; }
    </style>
</head>
<body>

<div id="app">
    <div id="player-wrap">
        <video id="my-video" controls class="fc" playsinline></video>
        <div id="brand-overlay"><span>AlameeereTv</span></div>
    </div>
    
    <div id="ch-rows">
        <!-- صف القنوات الأول -->
        <div class="ch-row">
            <div class="row-label">
                <span class="ico">📺</span>
                <span class="lbl">بث مباشر</span>
            </div>
            <div class="row-scroll">
                <!-- أضف روابط قنواتك هنا داخل خاصية data-url مباشرة -->
                <button class="ch" data-url="http://smpy24.live">قناة 1 (رابطك)</button>
                <button class="ch" data-url="http://vodobox.net">قناة تجريبية 2</button>
            </div>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('my-video');
    const playerWrap = document.getElementById('player-wrap');
    const channels = document.querySelectorAll('.ch');
    let hls = null;

    // دالة مخصصة لتشغيل الرابط المختار وتحويله لـ HTTPS تلقائياً
    function playM3u8(rawUrl) {
        // تمرير الرابط عبر البروكسي الآمن لحل مشكلة المحتوى المختلط في GitHub Pages
        const secureUrl = "https://allorigins.win" + encodeURIComponent(rawUrl);

        if (Hls.isSupported()) {
            if (hls) { hls.destroy(); } // إنهاء البث السابق لتجنب تداخل الذاكرة
            hls = new Hls();
            hls.loadSource(secureUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(err => console.log("بانتظار تفاعل المستخدم لتشغيل الفيديو"));
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = secureUrl;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    }

    // تفعيل التنقل بين القنوات عند الضغط على الأزرار
    channels.forEach(channel => {
        channel.addEventListener('click', function() {
            // إزالة التحديد النشط من القنوات الأخرى وإضافته للحالية
            channels.forEach(c => c.classList.remove('active'));
            this.classList.add('active');

            // جلب الرابط من الزر وتشغيله
            const targetUrl = this.getAttribute('data-url');
            if (targetUrl) {
                playM3u8(targetUrl);
            }
        });
    });

    // تشغيل القناة الأولى تلقائياً عند فتح الصفحة كمثال مبدئي
    if(channels.length > 0) {
        channels[0].classList.add('active');
        playM3u8(channels[0].getAttribute('data-url'));
    }

    // إخفاء واجهة الشعار المبدئية عند بدء عمل الفيديو
    video.addEventListener('play', () => {
        playerWrap.classList.add('playing');
    });
</script>

</body>
</html>
