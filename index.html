<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AlameeereTv</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;background:#000;overflow:hidden;
  font-family:system-ui,sans-serif;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}
#app{display:flex;flex-direction:column;width:100%;height:100%;}
#player-wrap{flex:1;min-height:0;position:relative;user-select:none;}
video{width:100%;height:100%;display:block;background:#000;}
video.fc{object-fit:contain;}   /* عادي */
video.fv{object-fit:cover;}    /* ملء */
video.ff{object-fit:fill;}     /* مضغوط */
#brightness-layer{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:4;}
#loader{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.75);z-index:10;}
#loader .spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,.15);border-top-color:#0f0;border-radius:50%;animation:spin .8s linear infinite;}
#loader span{color:rgba(255,255,255,.7);font-size:13px;}
@keyframes spin{to{transform:rotate(360deg)}}
#ch-title{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;z-index:6;display:none;}
#speed-badge{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;color:#0f0;z-index:6;transition:opacity .3s;}
#speed-badge.hide{opacity:0;pointer-events:none;}
#swipe-ind{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:14px 22px;display:none;flex-direction:column;align-items:center;gap:8px;z-index:20;pointer-events:none;min-width:130px;}
#si-icon{font-size:26px;}
#si-bar-bg{width:100%;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;}
#si-bar{height:100%;background:#0f0;border-radius:3px;}
#si-label{font-size:12px;color:rgba(255,255,255,.75);}
#dbl-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:15;opacity:0;transition:opacity .3s;}
#dbl-hint span{background:rgba(0,0,0,.75);color:#fff;font-size:15px;padding:12px 26px;border-radius:22px;border:1px solid rgba(255,255,255,.2);}
#dbl-hint.show{opacity:1;}
#controls-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.92));padding:30px 8px 10px;display:flex;align-items:center;gap:5px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100;overflow:visible;}
#player-wrap.show-ctrl #controls-overlay{opacity:1;pointer-events:auto;}
.cb{background:rgba(255,255,255,.12);border:none;color:#fff;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12px;backdrop-filter:blur(6px);transition:.2s;white-space:nowrap;flex-shrink:0;}
.cb:hover{background:rgba(255,255,255,.28);}
.cb.on{background:rgba(0,200,0,.2);color:#0f0;border:1px solid rgba(0,255,0,.3);}
#vw{display:flex;align-items:center;gap:5px;flex-shrink:0;}
#vs{-webkit-appearance:none;appearance:none;width:55px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);outline:none;cursor:pointer;}
#vs::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#0f0;cursor:pointer;}
#fg{flex:1;min-width:2px;}
#qw{position:relative;flex-shrink:0;}
#qm{position:absolute;bottom:calc(100% + 6px);right:0;background:rgba(10,10,10,.97);border:1px solid #333;border-radius:10px;display:none;flex-direction:column;min-width:110px;max-height:50vh;overflow-y:auto;z-index:9999;box-shadow:0 -4px 20px rgba(0,0,0,.8);}
#qm.open{display:flex;}
#qm button{background:none;border:none;color:#fff;padding:10px 16px;cursor:pointer;text-align:center;font-size:13px;}
#qm button:hover{background:rgba(255,255,255,.08);}
#qm button.active{color:#0f0;font-weight:700;}
#q-btn.manual{background:rgba(0,200,0,.2);color:#0f0;border:1px solid rgba(0,255,0,.35);}
#channels{height:80px;flex-shrink:0;background:#030303;display:flex;gap:5px;padding:10px;overflow-x:auto;align-items:center;border-top:1px solid #111;}
@media (orientation:landscape) and (max-height:450px){#channels{display:none;}}
#channels::-webkit-scrollbar{height:4px;}
#channels::-webkit-scrollbar-thumb{background:#222;border-radius:2px;}
.ch{min-width:78px;height:52px;background:#0a0a0a;border:1px solid #1a1a1a;color:#bbb;font-size:11px;font-weight:700;border-radius:8px;cursor:pointer;transition:.2s;flex-shrink:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px;}
.ch:hover{background:#151515;border-color:#0f0;color:#fff;}
.ch.on{background:#0f0;color:#000;border-color:#0f0;}
#add-ch{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:1000;background:rgba(0,0,0,.75);border:1px solid #333;color:#0f0;font-size:12px;padding:7px 14px;border-radius:7px;cursor:pointer;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:9999;display:none;align-items:center;justify-content:center;}
.modal-box{background:#0a0a0a;border:1px solid #222;border-radius:14px;padding:26px;width:92%;max-width:500px;}
.modal-box h2{color:#fff;margin-bottom:16px;font-size:17px;}
.modal-box input,.modal-box select{width:100%;padding:11px;margin:6px 0;background:#111;border:1px solid #2a2a2a;border-radius:7px;color:#fff;font-size:13px;}
.mbtn{padding:11px 24px;background:#0f0;color:#000;border:none;border-radius:7px;cursor:pointer;font-weight:700;margin-top:12px;font-size:13px;}
.mbtn.cancel{background:#1a1a1a;color:#fff;margin-right:8px;}
.row{display:flex;gap:8px;}.row input{flex:1;}
#err-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#a00;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;display:none;z-index:9999;}
</style>
</head>
<body>
<div id="app">
<button id="add-ch" onclick="toggleAdd()">+ قناة</button>
<div id="err-toast"></div>

<div class="modal" id="add-modal" onclick="if(event.target===this)toggleAdd()">
  <div class="modal-box">
    <h2>إضافة / تعديل قناة</h2>
    <input id="ch-name" placeholder="اسم القناة">
    <input id="ch-url" placeholder="رابط البث (m3u8)">
    <select id="ch-type"><option value="hls">HLS (.m3u8)</option></select>
    <div class="row"><input id="ch-idx" placeholder="رقم القناة للتعديل" type="number" min="1"></div>
    <div style="margin-top:8px">
      <button class="mbtn" onclick="saveChannel()">حفظ القناة</button>
      <button class="mbtn cancel" onclick="toggleAdd()">إلغاء</button>
    </div>
  </div>
</div>

<div id="player-wrap">
  <video id="vid" class="fc" playsinline webkit-playsinline></video>
  <div id="brightness-layer"></div>
  <div id="loader"><div class="spinner"></div><span id="loader-txt">جاري التحميل...</span></div>
  <div id="ch-title"></div>
  <div id="speed-badge">-- Mbps</div>
  <div id="swipe-ind">
    <div id="si-icon">🔊</div>
    <div id="si-bar-bg"><div id="si-bar" style="width:100%"></div></div>
    <div id="si-label">الصوت</div>
  </div>
  <div id="dbl-hint"><span id="dbl-txt">دوران الشاشة</span></div>
  <div id="controls-overlay">
    <button class="cb" onclick="togglePlay()">⏯️</button>
    <div id="vw">
      <button class="cb" id="mute-btn" onclick="toggleMute()">🔊</button>
      <input type="range" id="vs" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
    </div>
    <button class="cb" onclick="skip(-10)">⏪</button>
    <button class="cb" onclick="skip(10)">⏩</button>
    <button class="cb" id="fit-btn" onclick="cycleAspect()">↕ عادي</button>
    <button class="cb" id="spd-btn" onclick="toggleSpeed()">📶</button>
    <button class="cb" onclick="toggleFullscreen()">⛶</button>
    <div id="fg"></div>
    <div id="qw">
      <button class="cb" id="q-btn" onclick="toggleQ()">جودة</button>
      <div id="qm"></div>
    </div>
  </div>
</div>

<div id="channels"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
<script>
var CH=JSON.parse(localStorage.getItem('channels')||'null')||[
  {n:"الجزيرة",u:"https://live-hls-web-aja-gcp.thehlive.com/AJA/index.m3u8"},
  {n:"الجزيرة مباشر",u:"https://live-hls-web-ajm-gcp.thehlive.com/AJM/index.m3u8"},
  {n:"الجزيرة وثائق",u:"https://live-hls-web-ajd-gcp.thehlive.com/AJD/index.m3u8"},
  {n:"العربية",u:"https://live.alarabiya.net/alarabiapublish/alarabiya.smil/playlist.m3u8"},
  {n:"الحدث",u:"https://live.alarabiya.net/alarabiapublish/alhadath.smil/playlist.m3u8"},
  {n:"سكاي نيوز",u:"https://stream.skynewsarabia.com/hls/sna.m3u8"},
  {n:"الكأس 1",u:"https://liveeu-gcp.alkassdigital.net/alkass1-p/main.m3u8"},
  {n:"الكأس 2",u:"https://liveeu-gcp.alkassdigital.net/alkass2-p/main.m3u8"},
  {n:"الكأس 3",u:"https://liveeu-gcp.alkassdigital.net/alkass3-p/main.m3u8"},
  {n:"الكأس 4",u:"https://liveeu-gcp.alkassdigital.net/alkass4-p/main.m3u8"},
  {n:"الكأس 5",u:"https://liveeu-gcp.alkassdigital.net/alkass5-p/main.m3u8"},
  {n:"الكأس 6",u:"https://liveeu-gcp.alkassdigital.net/alkass6-p/main.m3u8"},
  {n:"البحرين سبورت 1",u:"https://5c7b683162943.streamlock.net/live/ngrp:sportsone_all/playlist.m3u8"},
  {n:"البحرين سبورت 2",u:"https://5c7b683162943.streamlock.net/live/ngrp:bahrainsportstwo_all/playlist.m3u8"},
  {n:"العراقية رياضية",u:"https://imn-live.esite-lab.com/hls/iraqia-sports-1.m3u8"},
  {n:"MBC 1",u:"https://auratvdz.lovable.app/api/public/stream?url=http%3A%2F%2Fcloth.orangecord.net%2Fpdf%2F3050%2Findex.m3u8%3Ftoken%3D%3D"},
  {n:"MBC 2",u:"https://auratvdz.lovable.app/api/public/stream?url=http%3A%2F%2Fcloth.orangecord.net%2Fpdf%2Fsat2MBC2%2Findex.m3u8%3Ftoken%3D%3D"},
  {n:"MBC Action",u:"https://auratvdz.lovable.app/api/public/stream?url=http%3A%2F%2Fcloth.orangecord.net%2Fpdf%2Fsat2MBCAction%2Findex.m3u8%3Ftoken%3D%3D"},
  {n:"MBC Masr",u:"https://auratvdz.lovable.app/api/public/stream?url=http%3A%2F%2Fcloth.orangecord.net%2Fpdf%2FsatMBCMASR%2Findex.m3u8%3Ftoken%3D%3D"},
  {n:"OSN Action",u:"https://auratvdz.lovable.app/api/public/stream?url=http%3A%2F%2Fcloth.orangecord.net%2Fpdf%2FOSNACTIONHD%2Findex.m3u8%3Ftoken%3D%3D"},
  {n:"beIN Drama",u:"https://auratvdz.lovable.app/api/public/stream?url=http%3A%2F%2Fstream.woodfencepods.com%2Fpdf%2FIC0gRg9bSFNxbAsWZmkLFRZASWV7fGg7BRceAV1GEQQ2GHcRfQ%2Findex.m3u8%3Ftoken%3D%3D"},
  {n:"القرآن الكريم",u:"https://cdn-globecast.akamaized.net/live/eds/saudi_quran/hls_roku/index.m3u8"},
  {n:"السنة النبوية",u:"https://cdn-globecast.akamaized.net/live/eds/saudi_sunnah/hls_roku/index.m3u8"}
];

var hls=null,cur=-1,retryT=null;
var vid=document.getElementById('vid');
var qm=document.getElementById('qm');
var qBtn=document.getElementById('q-btn');
var loader=document.getElementById('loader');
var loaderTxt=document.getElementById('loader-txt');
var chTitle=document.getElementById('ch-title');
var dblHint=document.getElementById('dbl-hint');
var dblTxt=document.getElementById('dbl-txt');
var swInd=document.getElementById('swipe-ind');
var siIcon=document.getElementById('si-icon');
var siBar=document.getElementById('si-bar');
var siLabel=document.getElementById('si-label');
var brightL=document.getElementById('brightness-layer');
var pw=document.getElementById('player-wrap');
var fitBtn=document.getElementById('fit-btn');
var speedBadge=document.getElementById('speed-badge');
var spdBtn=document.getElementById('spd-btn');
var lastCh=parseInt(localStorage.getItem('lastCh'));

var brightness=parseFloat(localStorage.getItem('brightness')||'0');
brightL.style.opacity=brightness;

// ===== قياسات الفيديو =====
// بدون أي fullscreen - فقط object-fit
var ASPECTS=[
  {cls:'fc', lbl:'↕ عادي'},    // contain
  {cls:'fv', lbl:'⛶ ملء'},       // cover - يملأ بدون افقي
  {cls:'ff', lbl:'↔ مضغوط'}   // fill - هامش أسود
];
var aspectIdx=parseInt(localStorage.getItem('aspectIdx')||'0');
function applyAspect(i){
  vid.className=ASPECTS[i].cls;
  fitBtn.textContent=ASPECTS[i].lbl;
  fitBtn.classList.toggle('on',i!==0);
  localStorage.setItem('aspectIdx',i);
}
function cycleAspect(){
  aspectIdx=(aspectIdx+1)%ASPECTS.length;
  applyAspect(aspectIdx);
}
applyAspect(aspectIdx);

// ===== سرعة النت =====
var speedOn=localStorage.getItem('speedOn')!=='0';
function applySpeedVis(){speedBadge.classList.toggle('hide',!speedOn);spdBtn.classList.toggle('on',speedOn);}
function toggleSpeed(){speedOn=!speedOn;localStorage.setItem('speedOn',speedOn?'1':'0');applySpeedVis();}
applySpeedVis();

var lastBytes=0,lastBytesTime=Date.now();
function updateSpeed(){
  try{
    var entries=performance.getEntriesByType('resource');
    var total=0;
    entries.forEach(function(e){
      if(e.transferSize>0&&(e.name.indexOf('.ts')>-1||e.name.indexOf('.m3u8')>-1||e.name.indexOf('.mp4')>-1||e.name.indexOf('.aac')>-1))
        total+=e.transferSize;
    });
    var now=Date.now();
    var dt=(now-lastBytesTime)/1000;
    var bps=Math.max(0,total-lastBytes)/dt;
    lastBytes=total;lastBytesTime=now;
    var lbl;
    if(bps>=1000000)lbl=(bps/1000000).toFixed(1)+' Mbps';
    else if(bps>=1000)lbl=Math.round(bps/1000)+' Kbps';
    else if(bps>0)lbl=Math.round(bps)+' bps';
    else lbl='...';
    speedBadge.textContent=lbl;
    speedBadge.style.color=bps>=5000000?'#0f0':bps>=1000000?'#ff0':bps>0?'#f80':'#888';
  }catch(e){}
}
setInterval(updateSpeed,1000);

function showLoader(t){loader.style.display='flex';loaderTxt.textContent=t||'جاري التحميل...';}
function hideLoader(){loader.style.display='none';}
function toast(msg){var t=document.getElementById('err-toast');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none';},4000);}

function buildChannels(){
  var box=document.getElementById('channels');
  box.innerHTML='';
  CH.forEach(function(c,i){
    var b=document.createElement('button');
    b.className='ch';b.textContent=c.n;
    b.onclick=function(){load(i);};
    box.appendChild(b);
  });
}

function load(idx){
  if(idx<0||idx>=CH.length)return;
  cur=idx;localStorage.setItem('lastCh',idx);
  if(retryT){clearTimeout(retryT);retryT=null;}
  document.querySelectorAll('.ch').forEach(function(b,i){b.classList.toggle('on',i===idx);});
  chTitle.textContent=CH[idx].n;chTitle.style.display='block';
  showLoader('جاري تحميل '+CH[idx].n+'...');
  if(hls){hls.destroy();hls=null;}
  vid.removeAttribute('src');vid.load();
  lastBytes=0;lastBytesTime=Date.now();
  try{performance.clearResourceTimings();}catch(e){}
  qBtn.classList.remove('manual');
  var url=CH[idx].u;
  if(Hls.isSupported()){
    hls=new Hls({enableWorker:true,maxBufferLength:30,maxMaxBufferLength:60,manifestLoadingMaxRetry:5,manifestLoadingRetryDelay:1000,levelLoadingMaxRetry:5,fragLoadingMaxRetry:5,startLevel:0});
    hls.loadSource(url);hls.attachMedia(vid);
    hls.on(Hls.Events.MANIFEST_PARSED,function(){hideLoader();vid.play().catch(function(){});buildQ();});
    hls.on(Hls.Events.FRAG_BUFFERED,function(){hideLoader();});
    hls.on(Hls.Events.ERROR,function(e,d){
      if(d.fatal){
        if(d.type===Hls.ErrorTypes.NETWORK_ERROR){loaderTxt.textContent='انقطع الاتصال، إعادة المحاولة...';loader.style.display='flex';hls.startLoad();retryT=setTimeout(function(){load(cur);},8000);}
        else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){hls.recoverMediaError();}
        else{retryT=setTimeout(function(){load(cur);},5000);}
      }
    });
  }else if(vid.canPlayType('application/vnd.apple.mpegurl')){
    vid.src=url;
    vid.addEventListener('loadeddata',function(){hideLoader();},{once:true});
    vid.play().catch(function(){});
  }else{
    hideLoader();toast('المتصفح لا يدعم البث');
  }
}

function buildQ(){
  qm.innerHTML='';
  if(!hls)return;
  var auto=document.createElement('button');
  auto.textContent='تلقائي';
  auto.onclick=function(){hls.currentLevel=-1;qBtn.classList.remove('manual');updateQActive();closeQ();};
  qm.appendChild(auto);
  hls.levels.forEach(function(lv,i){
    var b=document.createElement('button');
    b.textContent=lv.height?lv.height+'p':Math.round(lv.bitrate/1000)+'k';
    b.onclick=function(){hls.currentLevel=i;qBtn.classList.add('manual');updateQActive();closeQ();};
    qm.appendChild(b);
  });
  updateQActive();
}
function updateQActive(){
  var btns=qm.querySelectorAll('button');
  btns.forEach(function(b,i){
    if(i===0)b.classList.toggle('active',hls.currentLevel===-1);
    else b.classList.toggle('active',hls.currentLevel===(i-1));
  });
}
function closeQ(){qm.classList.remove('open');}
function toggleQ(){
  qm.classList.toggle('open');
  if(qm.classList.contains('open')){
    updateQActive();
    setTimeout(function(){var r=qm.getBoundingClientRect();if(r.right>window.innerWidth){qm.style.right='0';qm.style.left='auto';}else if(r.left<0){qm.style.left='0';qm.style.right='auto';}},0);
  }
}

function togglePlay(){vid.paused?vid.play():vid.pause();}
function toggleMute(){vid.muted=!vid.muted;document.getElementById('mute-btn').textContent=vid.muted?'🔇':'🔊';document.getElementById('vs').value=vid.muted?0:vid.volume;}
function setVolume(v){vid.volume=parseFloat(v);vid.muted=v==0;document.getElementById('mute-btn').textContent=v==0?'🔇':'🔊';document.getElementById('vs').value=v;localStorage.setItem('vol',v);}
function skip(s){vid.currentTime+=s;}
function toggleFullscreen(){
  if(document.fullscreenElement){document.exitFullscreen();}
  else{pw.requestFullscreen&&pw.requestFullscreen();}
}

// ===== سحب =====
var swType=null,swStartY=0,swStartVal=0,swTimer=null,isSwiping=false,tyStart=0,txStart=0;
function showSwipe(type,val){
  clearTimeout(swTimer);
  if(type==='vol'){siIcon.textContent=val>0?'🔊':'🔇';siLabel.textContent='الصوت '+Math.round(val*100)+'%';siBar.style.width=(val*100)+'%';siBar.style.background='#0f0';}
  else{siIcon.textContent='☀️';siLabel.textContent='الإضاءة '+Math.round((1-val/0.85)*100)+'%';siBar.style.width=((1-val/0.85)*100)+'%';siBar.style.background='#fbbf24';}
  swInd.style.display='flex';
  swTimer=setTimeout(function(){swInd.style.display='none';},1200);
}

// ===== ضغطتان = دوران =====
var lastTap=0,dblTimer=null,dblHintTimer=null;
function doRotate(){
  var p=Promise.resolve();
  try{
    if(screen.orientation&&screen.orientation.lock){
      if(screen.orientation.type.indexOf('landscape')>-1){p=screen.orientation.lock('portrait');dblTxt.textContent='عودة للعمودي ↑';}
      else{p=screen.orientation.lock('landscape');dblTxt.textContent='وضع أفقي ↔';}
    }else{toggleFullscreen();dblTxt.textContent='شاشة كاملة ⛶';}
  }catch(e){toggleFullscreen();dblTxt.textContent='شاشة كاملة ⛶';}
  p.catch(function(){toggleFullscreen();dblTxt.textContent='شاشة كاملة ⛶';});
  dblHint.classList.add('show');
  clearTimeout(dblHintTimer);
  dblHintTimer=setTimeout(function(){dblHint.classList.remove('show');},1500);
}

document.addEventListener('touchend',function(e){
  if(e.target.closest('#controls-overlay')||e.target.closest('#channels')||e.target.closest('#add-ch')||e.target.closest('.modal')||e.target.closest('#qm'))return;
  if(isSwiping)return;
  var now=Date.now();
  if(now-lastTap<350){
    lastTap=0;clearTimeout(dblTimer);dblTimer=null;
    doRotate();
  }else{
    lastTap=now;clearTimeout(dblTimer);
    if(e.target.closest('#player-wrap')){
      dblTimer=setTimeout(function(){
        pw.classList.add('show-ctrl');
        clearTimeout(hideCtrlT);
        hideCtrlT=setTimeout(function(){pw.classList.remove('show-ctrl');},3000);
      },350);
    }
  }
},{passive:true});

var hideCtrlT=null;
pw.addEventListener('touchstart',function(e){
  if(e.target.closest('#controls-overlay')||e.target.closest('#loader'))return;
  var t=e.touches[0];txStart=t.clientX;tyStart=t.clientY;isSwiping=false;
  var rect=pw.getBoundingClientRect();
  swType=(t.clientX-rect.left)>(rect.width/2)?'vol':'brightness';
  swStartY=t.clientY;
  swStartVal=swType==='vol'?vid.volume:brightness;
},{passive:true});
pw.addEventListener('touchmove',function(e){
  if(!swType||e.target.closest('#controls-overlay'))return;
  var t=e.touches[0];
  var dy=tyStart-t.clientY;
  if(!isSwiping&&Math.abs(dy)>12)isSwiping=true;
  if(!isSwiping)return;
  var delta=dy/pw.getBoundingClientRect().height;
  if(swType==='vol'){var v=Math.max(0,Math.min(1,swStartVal+delta));setVolume(v);showSwipe('vol',v);}
  else{var b=Math.max(0,Math.min(0.85,swStartVal-delta));brightness=b;brightL.style.opacity=b;localStorage.setItem('brightness',b);showSwipe('brightness',b);}
},{passive:true});
pw.addEventListener('touchend',function(){swType=null;setTimeout(function(){isSwiping=false;},50);},{passive:true});
pw.addEventListener('click',function(e){
  if(e.target.closest('#controls-overlay')||e.target.closest('#loader'))return;
  pw.classList.add('show-ctrl');clearTimeout(hideCtrlT);
  hideCtrlT=setTimeout(function(){pw.classList.remove('show-ctrl');},3000);
});
document.addEventListener('click',function(e){if(!e.target.closest('#qw'))closeQ();});
document.addEventListener('touchend',function(e){if(!e.target.closest('#qw'))closeQ();},{passive:true});

function toggleAdd(){
  var m=document.getElementById('add-modal');
  m.style.display=m.style.display!=='flex'?'flex':'none';
}
function saveChannel(){
  var name=document.getElementById('ch-name').value.trim();
  var url=document.getElementById('ch-url').value.trim();
  var idx=parseInt(document.getElementById('ch-idx').value)-1;
  if(!name||!url){toast('أدخل الاسم والرابط');return;}
  var ch={n:name,u:url};
  if(idx>=0&&idx<CH.length)CH[idx]=ch;else CH.push(ch);
  localStorage.setItem('channels',JSON.stringify(CH));
  buildChannels();toggleAdd();
  load(idx>=0&&idx<CH.length?idx:CH.length-1);
  ['ch-name','ch-url','ch-idx'].forEach(function(id){document.getElementById(id).value='';});
}
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  if(e.key===' '){e.preventDefault();togglePlay();}
  else if(e.key==='f'||e.key==='F')toggleFullscreen();
  else if(e.key==='m'||e.key==='M')toggleMute();
  else if(e.key==='a'||e.key==='A')cycleAspect();
  else if(e.key==='ArrowRight')skip(10);
  else if(e.key==='ArrowLeft')skip(-10);
  else if(e.key>='1'&&e.key<='9')load(parseInt(e.key)-1);
  else if(e.key==='0')load(9);
});
var sv=localStorage.getItem('vol');
if(sv){vid.volume=parseFloat(sv);document.getElementById('vs').value=sv;}
buildChannels();
var startCh=(!isNaN(lastCh)&&lastCh>=0&&lastCh<CH.length)?lastCh:0;
load(startCh);
</script>
</body>
