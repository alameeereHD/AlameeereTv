<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق البث المباشر</title>
  <!-- مكتبة HLS.js للبث المباشر بأقصى سرعة -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    /* المشغل الداخلي */
    .player-section {
      width: 100%;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 25px;
      aspect-ratio: 16 / 9;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* أسطر القنوات */
    .section-title {
      font-size: 1.4rem;
      margin: 20px 0 10px 0;
      color: #38bdf8;
      border-bottom: 2px solid #1e293b;
      padding-bottom: 5px;
    }
    .channels-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 15px;
      scroll-behavior: smooth;
    }
    .channels-row::-webkit-scrollbar {
      height: 6px;
    }
    .channels-row::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    /* كروت القنوات */
    .channel-card {
      min-width: 140px;
      background: #1e293b;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid #334155;
    }
    .channel-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #f8fafc;
    }
    
    /* الأزرار */
    .btn-group {
      display: flex;
      gap: 5px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
    }
    .btn:hover {
      background-color: #0369a1;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn-quality {
      flex: 1;
      padding: 4px 6px;
      font-size: 0.75rem;
      background-color: #475569;
    }
    .btn-quality:hover {
      background-color: #0284c7;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- المشغل الداخلي -->
    <div class="player-section">
      <video id="internalPlayer" controls autoplay muted></video>
    </div>

    <!-- أسطر القنوات -->
    <div id="content"></div>
  </div>

  <script>
    // --- 1. إعداد المشغل الداخلي للسرعة الخاطفة ---
    const videoElement = document.getElementById('internalPlayer');
    let hlsInstance = null;

    function playInternalStream(url) {
      if (Hls.isSupported()) {
        if (hlsInstance) {
          hlsInstance.destroy(); // تنظيف البث السابق
        }
        
        hlsInstance = new Hls({
          startLevel: 0,           // البدء فوراً بأدنى جودة لسرعة التشغيل
          maxBufferLength: 1,      // تقليل التخزين المؤقت للبدء الخاطف
          maxMaxBufferLength: 2,
          maxBufferSize: 1 * 1024 * 1024, // 1 ميجابايت فقط للتخزين المؤقت
          liveSyncDurationCount: 1,
          enableWorker: true
        });

        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(videoElement);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
          videoElement.play();
        });
      } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
        // دعم متصفحات Safari / iOS
        videoElement.src = url;
        videoElement.addEventListener('loadedmetadata', function () {
          videoElement.play();
        });
      }
    }

    // --- 2. منع النقر المزدوج عند فتح المشغل الخارجي ---
    let isOpeningExternal = false;

    function openExternalPlayer(url) {
      if (isOpeningExternal) return; // حماية ضد النقر المزدوج السريع
      isOpeningExternal = true;

      // توجيه للمشغل الخارجي (intent / app scheme)
      window.location.href = url;

      // إعادة تفعيل الإمكانية بعد ثانية واحدة
      setTimeout(() => {
        isOpeningExternal = false;
      }, 1000);
    }

    // --- 3. بيانات القنوات ---
    const categories = [
      {
        name: "beIN Sports",
        type: "bein",
        channels: [
          { name: "beIN 1", url: "https://example.com/bein1.m3u8" },
          { name: "beIN 2", url: "https://example.com/bein2.m3u8" },
          { name: "beIN 3", url: "https://example.com/bein3.m3u8" },
          { name: "beIN 4", url: "https://example.com/bein4.m3u8" },
          { name: "beIN 5", url: "https://example.com/bein5.m3u8" },
          { name: "beIN 6", url: "https://example.com/bein6.m3u8", qualities: { SD: "intent://example.com/bein6_sd.m3u8", HD: "intent://example.com/bein6_hd.m3u8", FHD: "intent://example.com/bein6_fhd.m3u8" } },
          { name: "beIN 7", url: "https://example.com/bein7.m3u8", qualities: { SD: "intent://example.com/bein7_sd.m3u8", HD: "intent://example.com/bein7_hd.m3u8", FHD: "intent://example.com/bein7_fhd.m3u8" } }
        ]
      },
      {
        name: "ألوان (Alwan)",
        type: "alwan",
        channels: [
          { name: "ألوان 1", url: "https://example.com/alwan1.m3u8" },
          { name: "ألوان 2", url: "https://example.com/alwan2.m3u8" },
          { name: "ألوان 3", url: "https://example.com/alwan3.m3u8" },
          { name: "ألوان 4", url: "intent://example.com/alwan4.m3u8" },
          { name: "ألوان 5", url: "intent://example.com/alwan5.m3u8" }
        ]
      },
      {
        name: "ثمانية (8)",
        type: "thamanya",
        channels: [
          { name: "ثمانية 1", url: "https://example.com/8_1.m3u8" },
          { name: "ثمانية 2", url: "https://example.com/8_2.m3u8" },
          { name: "ثمانية 3", url: "https://example.com/8_3.m3u8" },
          { name: "ثمانية 4", url: "intent://example.com/8_4.m3u8", qualities: { "1": "intent://example.com/8_4_1.m3u8", "2": "intent://example.com/8_4_2.m3u8", "3": "intent://example.com/8_4_3.m3u8" } },
          { name: "ثمانية 5", url: "intent://example.com/8_5.m3u8", qualities: { "1": "intent://example.com/8_5_1.m3u8", "2": "intent://example.com/8_5_2.m3u8", "3": "intent://example.com/8_5_3.m3u8" } }
        ]
      },
      {
        name: "الفجر",
        type: "alfajr",
        channels: [
          { name: "الفجر 1", url: "intent://example.com/fajr1.m3u8" },
          { name: "الفجر 2", url: "intent://example.com/fajr2.m3u8" },
          { name: "الفجر 3", url: "intent://example.com/fajr3.m3u8" }
        ]
      }
    ];

    // --- 4. معالجة وتوليد واجهة القنوات حسب المنطق المطلوبة ---
    const contentDiv = document.getElementById('content');

    categories.forEach(category => {
      const title = document.createElement('h2');
      title.className = 'section-title';
      title.innerText = category.name;
      contentDiv.appendChild(title);

      const row = document.createElement('div');
      row.className = 'channels-row';

      category.channels.forEach((channel, index) => {
        const card = document.createElement('div');
        card.className = 'channel-card';

        const nameEl = document.createElement('div');
        nameEl.className = 'channel-title';
        nameEl.innerText = channel.name;
        card.appendChild(nameEl);

        const btnGroup = document.createElement('div');
        btnGroup.className = 'btn-group';

        // التطبيق حسب الشروط المحدد لكل فئة:
        let isInternal = false;

        if (category.type === 'bein' && index < 5) isInternal = true;
        else if (category.type === 'alwan' && index < 3) isInternal = true;
        else if (category.type === 'thamanya' && index < 3) isInternal = true;
        else if (category.type === 'alfajr') isInternal = false;

        if (isInternal) {
          // زر تشغيل داخلي
          const btn = document.createElement('button');
          btn.className = 'btn';
          btn.innerText = 'تشغيل';
          btn.onclick = () => playInternalStream(channel.url);
          btnGroup.appendChild(btn);
        } else {
          // مشغل خارجي (مع فحص وجود أزرار جودات)
          if (channel.qualities) {
            Object.keys(channel.qualities).forEach(qLabel => {
              const qBtn = document.createElement('button');
              qBtn.className = 'btn btn-quality';
              qBtn.innerText = qLabel;
              qBtn.onclick = () => openExternalPlayer(channel.qualities[qLabel]);
              btnGroup.appendChild(qBtn);
            });
          } else {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'خارجي';
            btn.onclick = () => openExternalPlayer(channel.url);
            btnGroup.appendChild(btn);
          }
        }

        card.appendChild(btnGroup);
        row.appendChild(card);
      });

      contentDiv.appendChild(row);
    });

    // تشغيل أول قناة تلقائياً في المشغل الداخلي عند التحميل
    playInternalStream(categories[0].channels[0].url);
  </script>
</body>
</html>
