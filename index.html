<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AlameeereTv</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}
#app{display:flex;flex-direction:column;width:100%;height:100%;}
#player-wrap{flex:0 0 auto;height:calc(100% - 240px);position:relative;user-select:none;overflow:hidden;}
#player-wrap.fullscreen-mode{position:fixed;inset:0;width:100%;height:100%;z-index:9999;}
#app.fs #ch-rows{display:none;}
video{width:100%;height:100%;display:block;background:#000;}
video.fc{object-fit:contain;}video.fv{object-fit:fill;}video.ff{object-fit:contain;transform:scaleY(0.72);transform-origin:center center;}
#iframe-wrap{position:absolute;inset:0;display:none;z-index:5;}
#iframe-wrap iframe{width:100%;height:100%;border:none;}
#brightness-layer{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:4;}
#loader{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.75);z-index:10;}
#loader .spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,.15);border-top-color:#0f0;border-radius:50%;animation:spin .8s linear infinite;}
#loader span{color:rgba(255,255,255,.7);font-size:13px;}
@keyframes spin{to{transform:rotate(360deg)}}
#ch-title{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;z-index:6;display:none;}
#speed-badge{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;color:#0f0;z-index:6;transition:opacity .3s;cursor:pointer;user-select:none;}
#speed-badge.hide{opacity:0;pointer-events:none;}
#dbl-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:15;opacity:0;transition:opacity .3s;}
#dbl-hint span{background:rgba(0,0,0,.75);color:#fff;font-size:14px;padding:10px 22px;border-radius:20px;border:1px solid rgba(255,255,255,.2);}
#dbl-hint.show{opacity:1;}
#swipe-ind{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:14px 22px;display:none;flex-direction:column;align-items:center;gap:8px;z-index:20;pointer-events:none;min-width:130px;}
#si-icon{font-size:24px;}#si-bar-bg{width:100%;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;}#si-bar{height:100%;background:#0f0;border-radius:3px;}#si-label{font-size:11px;color:rgba(255,255,255,.75);}
/* شريط التحكم - أزرار أصغر */
#controls-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.92));padding:22px 4px 6px;display:flex;align-items:center;gap:3px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100;}
#player-wrap.show-ctrl #controls-overlay{opacity:1;pointer-events:auto;}
.cb{background:rgba(255,255,255,.12);border:none;color:#fff;padding:5px 7px;border-radius:5px;cursor:pointer;font-size:10px;backdrop-filter:blur(6px);transition:.2s;white-space:nowrap;flex-shrink:0;}
.cb:hover{background:rgba(255,255,255,.28);}.cb.on{background:rgba(0,200,0,.2);color:#0f0;border:1px solid rgba(0,255,0,.3);}
#vw{display:flex;align-items:center;gap:3px;flex-shrink:0;}
#vs{-webkit-appearance:none;appearance:none;width:42px;height:3px;border-radius:2px;background:rgba(255,255,255,.3);outline:none;cursor:pointer;}
#vs::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#0f0;cursor:pointer;}
#fg{flex:1;min-width:1px;}
#qw{position:relative;flex-shrink:0;}
#qm{position:fixed;background:rgba(10,10,10,.97);border:1px solid #333;border-radius:10px;display:none;flex-direction:column;min-width:100px;max-height:180px;overflow-y:auto;z-index:99999;box-shadow:0 -4px 20px rgba(0,0,0,.8);}
#qm.open{display:flex;}
#qm button{background:none;border:none;color:#fff;padding:9px 14px;cursor:pointer;text-align:center;font-size:12px;}
#qm button:hover{background:rgba(255,255,255,.08);}
#qm button.active{color:#0f0;font-weight:700;}
#q-btn.manual{background:rgba(0,200,0,.2);color:#0f0;border:1px solid rgba(0,255,0,.35);}
#ch-rows{flex-shrink:0;background:#030303;border-top:1px solid #111;display:flex;flex-direction:column;}
.ch-row{height:80px;display:flex;align-items:center;border-bottom:1px solid #0a0a0a;}
.row-label{flex-shrink:0;width:48px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#050505;border-left:1px solid #111;}
.row-label .ico{font-size:16px;}.row-label .lbl{font-size:8px;color:#666;font-weight:700;}
.row-scroll{flex:1;display:flex;gap:5px;padding:10px 8px;overflow-x:auto;align-items:center;}
.row-scroll::-webkit-scrollbar{height:4px;}.row-scroll::-webkit-scrollbar-thumb{background:#222;border-radius:2px;}
.ch{min-width:72px;height:50px;background:#0a0a0a;border:1px solid #1a1a1a;color:#bbb;font-size:10px;font-weight:700;border-radius:8px;cursor:pointer;transition:.2s;flex-shrink:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px;}
.ch:hover{background:#151515;border-color:#0f0;color:#fff;}.ch.on{background:#0f0;color:#000;border-color:#0f0;}
.ch.iframe-ch{border-color:#f80;}.ch.iframe-ch.on{background:#f80;color:#000;border-color:#f80;}
#add-ch{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:1000;background:rgba(0,0,0,.75);border:1px solid #333;color:#0f0;font-size:11px;padding:5px 12px;border-radius:7px;cursor:pointer;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:9999;display:none;align-items:center;justify-content:center;}
.modal-box{background:#0a0a0a;border:1px solid #222;border-radius:14px;padding:22px;width:92%;max-width:500px;}
.modal-box h2{color:#fff;margin-bottom:14px;font-size:16px;}
.modal-box input,.modal-box select{width:100%;padding:10px;margin:5px 0;background:#111;border:1px solid #2a2a2a;border-radius:7px;color:#fff;font-size:13px;}
.mbtn{padding:10px 22px;background:#0f0;color:#000;border:none;border-radius:7px;cursor:pointer;font-weight:700;margin-top:10px;font-size:13px;}
.mbtn.cancel{background:#1a1a1a;color:#fff;margin-right:8px;}
.row{display:flex;gap:8px;}.row input{flex:1;}
#err-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#a00;color:#fff;padding:8px 18px;border-radius:8px;font-size:12px;display:none;z-index:9999;}
</style>
</head>
<body>
<div id="app">
<button id="add-ch" onclick="toggleAdd()">+ قناة</button>
<div id="err-toast"></div>
<div class="modal" id="add-modal" onclick="if(event.target===this)toggleAdd()">
  <div class="modal-box">
    <h2>إضافة / تعديل قناة</h2>
    <input id="ch-name" placeholder="اسم القناة">
    <input id="ch-url" placeholder="رابط البث">
    <select id="ch-type"><option value="hls">HLS (.m3u8)</option><option value="iframe">إطار مضمن</option></select>
    <select id="ch-cat"><option value="0">أخبار</option><option value="1">رياضة</option><option value="2">وقت اللعب</option></select>
    <div class="row"><input id="ch-idx" placeholder="رقم القناة للتعديل" type="number" min="1"></div>
    <div style="margin-top:8px">
      <button class="mbtn" onclick="saveChannel()">حفظ</button>
      <button class="mbtn cancel" onclick="toggleAdd()">إلغاء</button>
    </div>
  </div>
</div>
<div id="player-wrap">
  <video id="vid" class="fc" playsinline webkit-playsinline></video>
  <div id="iframe-wrap"><iframe id="iframe-player" allowfullscreen allow="autoplay; encrypted-media"></iframe></div>
  <div id="brightness-layer"></div>
  <div id="loader"><div class="spinner"></div><span id="loader-txt">جاري التحميل...</span></div>
  <div id="ch-title"></div>
  <div id="speed-badge" onclick="runSpeedTest()">📡 السرعة</div>
  <div id="swipe-ind"><div id="si-icon">🔊</div><div id="si-bar-bg"><div id="si-bar" style="width:100%"></div></div><div id="si-label">الصوت</div></div>
  <div id="dbl-hint"><span id="dbl-txt">⛶ شاشة كاملة</span></div>
  <div id="controls-overlay">
    <button class="cb" onclick="togglePlay()">⏯</button>
    <div id="vw">
      <button class="cb" id="mute-btn" onclick="toggleMute()">🔊</button>
      <input type="range" id="vs" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
    </div>
    <button class="cb" onclick="skip(-10)">⏪</button>
    <button class="cb" onclick="skip(10)">⏩</button>
    <button class="cb" id="fit-btn" onclick="cycleAspect()">↕ عادي</button>
    <button class="cb" id="spd-btn" onclick="toggleSpeed()">📡</button>
    <button class="cb" onclick="doFullscreen()">⛶</button>
    <div id="fg"></div>
    <div id="qw"><button class="cb" id="q-btn" onclick="toggleQ()">جودة</button></div>
  </div>
</div>
<div id="ch-rows">
  <div class="ch-row"><div class="row-label"><span class="ico">📺</span><span class="lbl">أخبار</span></div><div class="row-scroll" id="row-0"></div></div>
  <div class="ch-row"><div class="row-label"><span class="ico">⚽</span><span class="lbl">رياضة</span></div><div class="row-scroll" id="row-1"></div></div>
  <div class="ch-row"><div class="row-label"><span class="ico">🏆</span><span class="lbl">وقت اللعب</span></div><div class="row-scroll" id="row-2"></div></div>
</div>
<div id="qm"></div>
</div>

var hls=null,cur={r:-1,i:-1},retryT=null;
var vid=document.getElementById('vid');
var iframeWrap=document.getElementById('iframe-wrap');
var iframePlayer=document.getElementById('iframe-player');
var app=document.getElementById('app');
var qm=document.getElementById('qm');
var qBtn=document.getElementById('q-btn');
var loader=document.getElementById('loader');
var loaderTxt=document.getElementById('loader-txt');
var chTitle=document.getElementById('ch-title');
var dblHint=document.getElementById('dbl-hint');
var dblTxt=document.getElementById('dbl-txt');
var swInd=document.getElementById('swipe-ind');
var siIcon=document.getElementById('si-icon');
var siBar=document.getElementById('si-bar');
var siLabel=document.getElementById('si-label');
var brightL=document.getElementById('brightness-layer');
var pw=document.getElementById('player-wrap');
var fitBtn=document.getElementById('fit-btn');
var speedBadge=document.getElementById('speed-badge');
var spdBtn=document.getElementById('spd-btn');
var brightness=parseFloat(localStorage.getItem('brightness')||'0');
brightL.style.opacity=brightness;

var ASPECTS=[{cls:'fc',lbl:'↕ عادي'},{cls:'fv',lbl:'⛶ ملء'},{cls:'ff',lbl:'↔ مفيد'}];
var aspectIdx=parseInt(localStorage.getItem('aspectIdx')||'0');
function applyAspect(i){vid.className=ASPECTS[i].cls;fitBtn.textContent=ASPECTS[i].lbl;fitBtn.classList.toggle('on',i!==0);localStorage.setItem('aspectIdx',i);}
function cycleAspect(){aspectIdx=(aspectIdx+1)%ASPECTS.length;applyAspect(aspectIdx);}
applyAspect(aspectIdx);

var isFS=false;
function doFullscreen(){
  if(isFS){exitFS();}else{enterFS();}
}
function enterFS(){
  isFS=true;
  app.classList.add('fs');
  pw.classList.add('fullscreen-mode');
  showDblHint('⛶ اضغط مرتين للخروج');
  if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(function(){});
  var el=document.documentElement;
  if(el.requestFullscreen)el.requestFullscreen().catch(function(){});
  else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
}
function exitFS(){
  isFS=false;
  app.classList.remove('fs');
  pw.classList.remove('fullscreen-mode');
  closeQ();
  if(document.fullscreenElement)document.exitFullscreen().catch(function(){});
  if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();
}
document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement&&isFS)exitFS();});

var speedOn=localStorage.getItem('speedOn')!=='0';
var isTesting=false,speedInterval=null;
var TEST_URLS=['https://httpbin.org/bytes/200000','https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/PNG_transparency_demonstration_1.png/240px-PNG_transparency_demonstration_1.png'];
var urlIdx=0;
function runSpeedTest(){if(isTesting)return;isTesting=true;speedBadge.textContent='📡 ...';var url=TEST_URLS[urlIdx%TEST_URLS.length]+'?r='+Date.now();var t0=Date.now();fetch(url,{cache:'no-store'}).then(function(r){return r.blob();}).then(function(b){var elapsed=(Date.now()-t0)/1000;var bps=((b.size||200000)*8)/elapsed;showSpeed(bps);isTesting=false;}).catch(function(){urlIdx++;isTesting=false;});}
function showSpeed(bps){var lbl=bps>=1000000?'📡 '+(bps/1000000).toFixed(1)+' Mbps':'📡 '+Math.round(bps/1000)+' Kbps';speedBadge.textContent=lbl;speedBadge.style.color=bps>=10000000?'#0f0':bps>=2000000?'#ff0':bps>=500000?'#f80':'#f44';}
function applySpeedVis(){speedBadge.classList.toggle('hide',!speedOn);spdBtn.classList.toggle('on',speedOn);if(speedOn){if(!speedInterval){runSpeedTest();speedInterval=setInterval(runSpeedTest,15000);}}else{if(speedInterval){clearInterval(speedInterval);speedInterval=null;}}}
function toggleSpeed(){speedOn=!speedOn;localStorage.setItem('speedOn',speedOn?'1':'0');applySpeedVis();}
applySpeedVis();

function showLoader(t){loader.style.display='flex';loaderTxt.textContent=t||'جاري التحميل...';}
function hideLoader(){loader.style.display='none';}
function toast(msg){var t=document.getElementById('err-toast');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none';},4000);}

function buildChannels(){
  ROWS.forEach(function(row,ri){
    var box=document.getElementById('row-'+ri);box.innerHTML='';
    row.channels.forEach(function(c,ci){
      var b=document.createElement('button');
      b.className='ch'+(c.t==='iframe'?' iframe-ch':'');
      b.textContent=c.n;b.id='ch-'+ri+'-'+ci;
      b.onclick=function(){load(ri,ci);};
      box.appendChild(b);
    });
  });
}

function load(ri,ci){
  if(ri<0||ri>=ROWS.length||ci<0||ci>=ROWS[ri].channels.length)return;
  cur={r:ri,i:ci};
  if(retryT){clearTimeout(retryT);retryT=null;}
  document.querySelectorAll('.ch').forEach(function(b){b.classList.remove('on');});
  var btn=document.getElementById('ch-'+ri+'-'+ci);
  if(btn)btn.classList.add('on');
  var ch=ROWS[ri].channels[ci];
  chTitle.textContent=ch.n;chTitle.style.display='block';
  var type=ch.t||'hls';
  if(type==='iframe'){
    if(hls){hls.destroy();hls=null;}
    vid.style.display='none';iframeWrap.style.display='block';
    showLoader('جاري تحميل '+ch.n+'...');
    iframePlayer.src='';
    setTimeout(function(){iframePlayer.src=ch.u;hideLoader();},400);
    qm.innerHTML='';closeQ();return;
  }
  vid.style.display='block';iframeWrap.style.display='none';iframePlayer.src='';
  showLoader('جاري تحميل '+ch.n+'...');
  if(hls){hls.destroy();hls=null;}
  vid.removeAttribute('src');vid.load();qBtn.classList.remove('manual');
  if(Hls.isSupported()){
    hls=new Hls({enableWorker:true,maxBufferLength:30,maxMaxBufferLength:60,manifestLoadingMaxRetry:5,manifestLoadingRetryDelay:1000,levelLoadingMaxRetry:5,fragLoadingMaxRetry:5,startLevel:0,autoLevelEnabled:false,capLevelToPlayerSize:false});
    hls.loadSource(ch.u);hls.attachMedia(vid);
    hls.on(Hls.Events.MANIFEST_PARSED,function(){hls.currentLevel=0;hideLoader();vid.play().catch(function(){});buildQ();});
    hls.on(Hls.Events.FRAG_BUFFERED,function(){hideLoader();});
    hls.on(Hls.Events.ERROR,function(e,d){if(d.fatal){if(d.type===Hls.ErrorTypes.NETWORK_ERROR){loaderTxt.textContent='انقطع الاتصال، إعادة المحاولة...';loader.style.display='flex';hls.startLoad();retryT=setTimeout(function(){load(cur.r,cur.i);},8000);}else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){hls.recoverMediaError();}else{retryT=setTimeout(function(){load(cur.r,cur.i);},5000);}}});
  }else if(vid.canPlayType('application/vnd.apple.mpegurl')){
    vid.src=ch.u;vid.addEventListener('loadeddata',function(){hideLoader();},{once:true});vid.play().catch(function(){});
  }else{hideLoader();toast('المتصفح غير متوافق');}
}

function buildQ(){
  qm.innerHTML='';if(!hls)return;
  var a=document.createElement('button');a.textContent='تلقائي';
  a.onclick=function(){hls.currentLevel=-1;hls.autoLevelEnabled=true;qBtn.classList.remove('manual');updateQActive();closeQ();};
  qm.appendChild(a);
  hls.levels.forEach(function(lv,i){
    var b=document.createElement('button');
    b.textContent=lv.height?lv.height+'p':Math.round(lv.bitrate/1000)+'k';
    b.onclick=function(){hls.autoLevelEnabled=false;hls.currentLevel=i;qBtn.classList.add('manual');updateQActive();closeQ();};
    qm.appendChild(b);
  });updateQActive();
}
function updateQActive(){if(!hls)return;var btns=qm.querySelectorAll('button');btns.forEach(function(b,i){if(i===0)b.classList.toggle('active',hls.currentLevel===-1);else b.classList.toggle('active',hls.currentLevel===(i-1));});}
function closeQ(){qm.classList.remove('open');}
function toggleQ(){
  if(qm.classList.contains('open')){closeQ();return;}
  var btnR=qBtn.getBoundingClientRect();
  var itemCount=qm.children.length||4;
  var qH=Math.min(180,itemCount*38+10);
  var top=btnR.top-qH-8;
  if(top<4)top=btnR.bottom+8;
  var right=window.innerWidth-btnR.right;
  if(right<0)right=4;
  qm.style.top=top+'px';
  qm.style.right=right+'px';
  qm.style.left='auto';
  qm.style.bottom='auto';
  qm.classList.add('open');
  updateQActive();
}
function togglePlay(){if(cur.r>=0&&ROWS[cur.r].channels[cur.i].t==='iframe')return;vid.paused?vid.play():vid.pause();}
function toggleMute(){vid.muted=!vid.muted;document.getElementById('mute-btn').textContent=vid.muted?'🔇':'🔊';document.getElementById('vs').value=vid.muted?0:vid.volume;}
function setVolume(v){vid.volume=parseFloat(v);vid.muted=v==0;document.getElementById('mute-btn').textContent=v==0?'🔇':'🔊';document.getElementById('vs').value=v;localStorage.setItem('vol',v);}
function skip(s){vid.currentTime+=s;}

var swType=null,swStartY=0,swStartVal=0,swTimer=null,isSwiping=false,tyStart=0;
function showSwipe(type,val){clearTimeout(swTimer);if(type==='vol'){siIcon.textContent='🔊';siLabel.textContent='الصوت '+Math.round(val*100)+'%';siBar.style.width=(val*100)+'%';siBar.style.background='#0f0';}else{siIcon.textContent='☀️';siLabel.textContent='الإضاءة '+Math.round((1-val/0.85)*100)+'%';siBar.style.width=((1-val/0.85)*100)+'%';siBar.style.background='#fbbf24';}swInd.style.display='flex';swTimer=setTimeout(function(){swInd.style.display='none';},1200);}

var lastTap=0,dblTimer=null,dblHintTimer=null;
function showDblHint(txt){dblTxt.textContent=txt;dblHint.classList.add('show');clearTimeout(dblHintTimer);dblHintTimer=setTimeout(function(){dblHint.classList.remove('show');},1500);}
var hideCtrlT=null;

document.addEventListener('touchend',function(e){
  if(e.target.closest('#controls-overlay')||e.target.closest('#ch-rows')||e.target.closest('#add-ch')||e.target.closest('.modal')||e.target.closest('#qm')||e.target.closest('#speed-badge')||e.target.closest('#iframe-wrap'))return;
  if(isSwiping)return;
  var now=Date.now();
  if(now-lastTap<400&&lastTap>0){
    lastTap=0;clearTimeout(dblTimer);dblTimer=null;
    doFullscreen();
  }else{
    lastTap=now;clearTimeout(dblTimer);
    if(e.target.closest('#player-wrap')){
      dblTimer=setTimeout(function(){lastTap=0;pw.classList.add('show-ctrl');clearTimeout(hideCtrlT);hideCtrlT=setTimeout(function(){pw.classList.remove('show-ctrl');},3000);},400);
    }
  }
},{passive:true});

pw.addEventListener('touchstart',function(e){
  if(e.target.closest('#controls-overlay')||e.target.closest('#loader')||e.target.closest('#speed-badge')||e.target.closest('#iframe-wrap'))return;
  var t=e.touches[0];tyStart=t.clientY;isSwiping=false;
  var rect=pw.getBoundingClientRect();
  swType=(t.clientX-rect.left)>(rect.width/2)?'vol':'brightness';
  swStartY=t.clientY;swStartVal=swType==='vol'?vid.volume:brightness;
},{passive:true});
pw.addEventListener('touchmove',function(e){
  if(!swType||e.target.closest('#controls-overlay')||e.target.closest('#iframe-wrap'))return;
  var t=e.touches[0];var dy=tyStart-t.clientY;
  if(!isSwiping&&Math.abs(dy)>12)isSwiping=true;
  if(!isSwiping)return;
  var delta=dy/pw.getBoundingClientRect().height;
  if(swType==='vol'){var v=Math.max(0,Math.min(1,swStartVal+delta));setVolume(v);showSwipe('vol',v);}
  else{var b=Math.max(0,Math.min(0.85,swStartVal-delta));brightness=b;brightL.style.opacity=b;localStorage.setItem('brightness',b);showSwipe('brightness',b);}
},{passive:true});
pw.addEventListener('touchend',function(){swType=null;setTimeout(function(){isSwiping=false;},50);},{passive:true});

pw.addEventListener('click',function(e){
  if(e.target.closest('#controls-overlay')||e.target.closest('#loader')||e.target.closest('#speed-badge')||e.target.closest('#iframe-wrap'))return;
  pw.classList.add('show-ctrl');clearTimeout(hideCtrlT);
  hideCtrlT=setTimeout(function(){pw.classList.remove('show-ctrl');},3000);
});
document.addEventListener('click',function(e){if(!e.target.closest('#qw')&&!e.target.closest('#qm'))closeQ();});

function toggleAdd(){var m=document.getElementById('add-modal');m.style.display=m.style.display!=='flex'?'flex':'none';}
function saveChannel(){
  var name=document.getElementById('ch-name').value.trim();
  var url=document.getElementById('ch-url').value.trim();
  var type=document.getElementById('ch-type').value||'hls';
  var cat=parseInt(document.getElementById('ch-cat').value)||0;
  if(!name||!url){toast('أدخل الاسم والرابط');return;}
  ROWS[cat].channels.push({n:name,u:url,t:type});
  buildChannels();toggleAdd();
  load(cat,ROWS[cat].channels.length-1);
  ['ch-name','ch-url','ch-idx'].forEach(function(id){document.getElementById(id).value='';});
}
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  if(e.key===' '){e.preventDefault();togglePlay();}
  else if(e.key==='f'||e.key==='F')doFullscreen();
  else if(e.key==='m'||e.key==='M')toggleMute();
  else if(e.key==='a'||e.key==='A')cycleAspect();
  else if(e.key==='Escape'&&isFS)exitFS();
});
var sv=localStorage.getItem('vol');
if(sv){vid.volume=parseFloat(sv);document.getElementById('vs').value=sv;}
buildChannels();
load(0,0);
</script>
</body>
</html>
