            showLoader();
            clearTimeout(retryT);

          hideLoader();
          channelError();

          retryT = setTimeout(reloadCurrentStream, 5000);

      if (ch.single || ch.levels) {
        var source = ch.single || { levels: ch.levels };
        if (ch.logo) {
          var card = makeLogoCard(ch, styleClass, function () {
            selectMulti(card, ch.name, source, ci);
          });
          box.appendChild(card);
        } else {
          var btn = makeTextChannel(ch, function () {
            resetSelection();
            btn.classList.add('on', 'channel-active');
            showTitle(ch.name);
            cur = { r: -2, i: ci };
            playChannel(source, ch.name);
          });
          box.appendChild(btn);
        }
        return;
      }

      var card = el('div', 'multi-card ' + styleClass);
      var wrap = el('div', 'lw');
      var img = el('img');
      img.src = ch.logo;
      img.alt = ch.name;
      if (ch.sport) img.className = 'cv';
      img.onerror = function () { this.style.display = 'none'; };
      wrap.appendChild(img);
      if (ch.num) wrap.appendChild(el('span', 'cn', ch.num));
      card.appendChild(wrap);
      card.appendChild(el('div', 'ch-name', ch.name));
      var qRow = el('div', 'q-row');
      [{ lbl: 'SD', key: 'sd' }, { lbl: 'HD', key: 'hd' }, { lbl: '4K', key: 'uhd' }].forEach(function (q) {
        if (!ch[q.key]) return;
        var qBtnEl = el('button', '', q.lbl);
        qBtnEl.onclick = function (e) {
          e.stopPropagation();
          resetSelection();
          card.classList.add('channel-active');
          qBtnEl.classList.add('on');
          showTitle(ch.name + ' ' + q.lbl);
          cur = { r: -2, i: ci };
          playChannel(ch[q.key], ch.name + ' ' + q.lbl);
        };
        qRow.appendChild(qBtnEl);
      });
      card.appendChild(qRow);
      box.appendChild(card);
    });
  }

  function buildChannels() {
    ROWS.forEach(function (row, ri) {
      var box = document.getElementById('row-' + ri);
      if (!box) return;
      box.innerHTML = '';
      row.channels.forEach(function (c, ci) {
        if (c.logo) {
          var card = el('div', 'multi-card');
          var wrap = el('div', 'lw');
          var img = el('img');
          img.src = c.logo;
          img.alt = c.n;
          img.onerror = function () {
            this.style.display = 'none';
            wrap.textContent = '📺';
          };
          wrap.appendChild(img);
          card.appendChild(wrap);
          // اسم القناة مخفي في CSS (display:none)
          card.appendChild(el('div', 'ch-name', c.n));
          card.onclick = function () {
            load(ri, ci);
          };
          box.appendChild(card);
        } else {
          var cls = 'ch';
          if (c.t === 'iframe') cls += ' iframe-ch';
          if (c.t === 'ts') cls += ' ts-ch';
          var b = el('button', cls, c.n);
          b.id = 'ch-' + ri + '-' + ci;
          b.onclick = function () { load(ri, ci); };
          box.appendChild(b);
        }
      });
    });
    buildEventRow();
    buildMultiRow(BEIN_CH, 'row-bein', 'bein-style');
    buildMultiRow(ALWAN_CH, 'row-alwan', 'alwan-style');
    buildMultiRow(THM_CH, 'row-thm', 'thm-style');
  }

  function load(ri, ci) {
    if (ri < 0 || ri >= ROWS.length || ci < 0 || ci >= ROWS[ri].channels.length) return;
    var ch = ROWS[ri].channels[ci];
    curEvtUrl = null;
    curPlayUrl = ch.u || null;
    curPlayName = ch.n || '';
    cur = { r: ri, i: ci };
    if (retryT) {
      clearTimeout(retryT);
      retryT = null;
    }
    resetSelection();
    var box = document.getElementById('row-' + ri);
    if (box) {
      var children = box.children;
      for (var idx = 0; idx < children.length; idx++) {
        var child = children[idx];
        if (child.classList && child.classList.contains('multi-card')) {
          var img = child.querySelector('img');
          if (img && img.alt === ch.n) {
            child.classList.add('channel-active');
            break;
          }
        } else if (child.id === 'ch-' + ri + '-' + ci) {
          child.classList.add('on', 'channel-active');
        }
      }
    }
    showTitle(ch.n);
    var t = ch.t || 'hls';
    if (t === 'ts') {
      openExtDialog(ch.u, ch.n);
      return;
    }
    if (t === 'iframe') {
      destroyHls();
      vid.style.display = 'none';
      ifw.style.display = 'block';
      pw.classList.add('playing');
      showLoader();
      ifp.src = '';
      setTimeout(function () {
        ifp.src = ch.u;
        hideLoader();
      }, 400);
      qm.innerHTML = '';
      return;
    }
    startHls(ch.u);
  }

  function buildQ() {
    qm.innerHTML = '';
    if (!hls) return;
    var lvls = hls.levels;
    if (!lvls || !lvls.length) return;
    var autoBtn = el('button', '', 'تلقائي');
    autoBtn.onclick = function () {
      hls.currentLevel = -1;
      hls.autoLevelEnabled = true;
      qBtn.classList.remove('manual');
      updateQActive();
      closeQ();
    };
    qm.appendChild(autoBtn);
    lvls.forEach(function (lv, i) {
      var b = el('button', '', lv.height ? lv.height + 'p' : Math.round(lv.bitrate / 1000) + 'k');
      b.onclick = function () {
        hls.autoLevelEnabled = false;
        hls.currentLevel = i;
        qBtn.classList.add('manual');
        updateQActive();
        closeQ();
      };
      qm.appendChild(b);
    });
    updateQActive();
  }

  function updateQActive() {
    if (!hls) return;
    $all('button', qm).forEach(function (b, i) {
      if (i === 0) b.classList.toggle('active', hls.currentLevel === -1);
      else b.classList.toggle('active', hls.currentLevel === (i - 1));
    });
  }

  function closeQ() { qm.classList.remove('open'); }

  function toggleQ() {
    qm.classList.toggle('open');
    if (qm.classList.contains('open')) updateQActive();
  }

  function togglePlay() {
    if (vid.paused) vid.play();
    else vid.pause();
  }

  function toggleMute() {
    vid.muted = !vid.muted;
    muteBtn.textContent = vid.muted ? '🔇' : '🔊';
    volSlider.value = vid.muted ? 0 : vid.volume;
  }

  function setVolume(v) {
    vid.volume = parseFloat(v);
    vid.muted = v == 0;
    muteBtn.textContent = v == 0 ? '🔇' : '🔊';
    volSlider.value = v;
    localStorage.setItem('vol', v);
  }

  function skip(s) { vid.currentTime += s; }

  function showSwipe(type, val) {
    clearTimeout(swTm);
    if (type === 'vol') {
      siIcon.textContent = '🔊';
      siLabel.textContent = 'الصوت ' + Math.round(val * 100) + '%';
      siBar.style.width = (val * 100) + '%';
      siBar.style.background = '#0f0';
    } else {
      siIcon.textContent = '☀️';
      siLabel.textContent = 'الإضاءة ' + Math.round((1 - val / .85) * 100) + '%';
      siBar.style.width = ((1 - val / .85) * 100) + '%';
      siBar.style.background = '#fbbf24';
    }
    swInd.style.display = 'flex';
    swTm = setTimeout(function () { swInd.style.display = 'none'; }, 1200);
  }

  function showDH(txt) {
    dblTxt.textContent = txt;
    dblHint.classList.add('show');
    clearTimeout(dblHT);
    dblHT = setTimeout(function () { dblHint.classList.remove('show'); }, 1500);
  }

  function showControls() {
    pw.classList.add('show-ctrl');
    clearTimeout(hCtrl);
    hCtrl = setTimeout(function () { pw.classList.remove('show-ctrl'); }, 3000);
  }

  function isControlTarget(e) {
    return e.target.closest('#controls-overlay')
      || e.target.closest('#ch-rows')
      || e.target.closest('#qm')
      || e.target.closest('#speed-badge')
      || e.target.closest('#iframe-wrap')
      || e.target.closest('#ext-dialog')
      || e.target.closest('#loader');
  }

  document.addEventListener('fullscreenchange', function () {
    setFUI(!!document.fullscreenElement);
  });
  document.addEventListener('webkitfullscreenchange', function () {
    setFUI(!!(document.fullscreenElement || document.webkitFullscreenElement));
  });

  extDialogOverlay.addEventListener('click', function (e) {
    if (e.target === extDialogOverlay) closeExtDialog();
  });
  document.getElementById('ext-btn-cancel').addEventListener('click', closeExtDialog);
  document.getElementById('ext-btn-store').addEventListener('click', openExtStore);
  document.getElementById('ext-btn-confirm').addEventListener('click', confirmExtDialog);

  document.getElementById('play-btn').addEventListener('click', togglePlay);
  muteBtn.addEventListener('click', toggleMute);
  volSlider.addEventListener('input', function () { setVolume(this.value); });
  document.getElementById('skip-back-btn').addEventListener('click', function () { skip(-10); });
  document.getElementById('skip-fwd-btn').addEventListener('click', function () { skip(10); });
  fitBtn.addEventListener('click', cycleAspect);
  spdBtn.addEventListener('click', toggleSpeed);
  document.getElementById('fs-btn').addEventListener('click', doFullscreen);
  document.getElementById('reload-btn').addEventListener('click', reloadCurrentStream);
  document.getElementById('ext-play-btn').addEventListener('click', openCurrentExternal);
  qBtn.addEventListener('click', toggleQ);
  speedBadge.addEventListener('click', runSpeedTest);

  document.addEventListener('touchend', function (e) {
    if (isControlTarget(e) || isSwiping) return;
    var now = Date.now();
    if (now - lTap < 400 && lTap > 0) {
      lTap = 0;
      clearTimeout(dblT);
      dblT = null;
      doFullscreen();
      showDH('⛶ شاشة كاملة');
    } else {
      lTap = now;
      clearTimeout(dblT);
      if (e.target.closest('#player-wrap')) {
        dblT = setTimeout(function () {
          lTap = 0;
          showControls();
        }, 400);
      }
    }
  }, { passive: true });

  pw.addEventListener('touchstart', function (e) {
    if (isControlTarget(e)) return;
    var t = e.touches[0];
    tyS = t.clientY;
    isSwiping = false;
    var r = pw.getBoundingClientRect();
    swT = (t.clientX - r.left) > (r.width / 2) ? 'vol' : 'brightness';
    swSV = swT === 'vol' ? vid.volume : brightness;
  }, { passive: true });

  pw.addEventListener('touchmove', function (e) {
    if (!swT || e.target.closest('#controls-overlay') || e.target.closest('#iframe-wrap')) return;
    var t = e.touches[0];
    var dy = tyS - t.clientY;
    if (!isSwiping && Math.abs(dy) > 12) isSwiping = true;
    if (!isSwiping) return;
    var delta = dy / pw.getBoundingClientRect().height;
    if (swT === 'vol') {
      var v = Math.max(0, Math.min(1, swSV + delta));
      setVolume(v);
      showSwipe('vol', v);
    } else {
      var b = Math.max(0, Math.min(.85, swSV - delta));
      brightness = b;
      brightL.style.opacity = b;
      localStorage.setItem('brightness', b);
      showSwipe('brightness', b);
    }
  }, { passive: true });

  pw.addEventListener('touchend', function () {
    swT = null;
    setTimeout(function () { isSwiping = false; }, 50);
  }, { passive: true });

  pw.addEventListener('click', function (e) {
    if (isControlTarget(e)) return;
    showControls();
  });

  document.addEventListener('click', function (e) {
    if (e.target.closest('#q-btn')) return;
    if (!e.target.closest('#qw')) closeQ();
  });

  function bindChannelListScroll() {
    var startX = 0;
    var startY = 0;
    var startTop = 0;
    var axis = null;
    var active = false;

    chRows.addEventListener('touchstart', function (e) {
      if (!e.touches.length) return;
      var t = e.touches[0];
      startX = t.clientX;
      startY = t.clientY;
      startTop = chRows.scrollTop;
      axis = null;
      active = true;
    }, { passive: true });

    chRows.addEventListener('touchmove', function (e) {
      if (!active || !e.touches.length) return;
      var t = e.touches[0];
      var adx = Math.abs(t.clientX - startX);
      var ady = Math.abs(t.clientY - startY);
      if (!axis) {
        if (adx < 8 && ady < 8) return;
        axis = ady > adx ? 'y' : 'x';
      }
      if (axis !== 'y') return;
      e.preventDefault();
      chRows.scrollTop = startTop - (t.clientY - startY);
    }, { passive: false });

    chRows.addEventListener('touchend', function () {
      active = false;
      axis = null;
    }, { passive: true });

    chRows.addEventListener('touchcancel', function () {
      active = false;
      axis = null;
    }, { passive: true });
  }

  applyAspect(aIdx);
  applySpeedVis();

  var savedVol = localStorage.getItem('vol');
  if (savedVol) {
    vid.volume = parseFloat(savedVol);
    volSlider.value = savedVol;
  }

  bindChannelListScroll();
  buildChannels();
  load(0, 0);
})();
</script>
</body>
</html>
